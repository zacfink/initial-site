    <style>
html { touch-action: manipulation; } /* no double-tap zoom; pinch still works */
      :root {
        --paper: #ffffff;
        --paper-2: #f5f6f7;
        --paper-blur: rgba(255, 255, 255, 0.72);
        --ink: #0a0a0a;
        --ink-muted: #5a5f66;
        --hairline: #e3e5e8;
        --signal: #3a35ff;
        --signal-dim: rgba(58, 53, 255, 0.16);
        --field: #0a0a0a;
        --field-ink: #ffffff;
        --field-muted: rgba(255, 255, 255, 0.62);
        --field-rule: rgba(255, 255, 255, 0.28);

        --display: "Space Grotesk", system-ui, sans-serif;
        /* one body family: the system font (SF on Apple devices); Space Grotesk stays for headings */
        --body: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
        --mono: var(--body);

        --pad: clamp(1.25rem, 5vw, 4rem);
        --maxw: 1080px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0b0c0e;
          --paper-2: #14161a;
          --paper-blur: rgba(11, 12, 14, 0.72);
          --ink: #f2f3f5;
          --ink-muted: #9aa0a8;
          --hairline: #242830;
          --signal: #6f6bff;
          --signal-dim: rgba(111, 107, 255, 0.22);
          --field: #171a20;
          --field-ink: #f2f3f5;
          --field-muted: rgba(242, 243, 245, 0.62);
          --field-rule: rgba(242, 243, 245, 0.26);
        }
      }

      * {
        box-sizing: border-box;
      }

      /* the surfaces the browser draws still belong to the design */
      ::selection {
        background: var(--signal);
        color: #fff;
      }
      html {
        caret-color: var(--signal);
        scrollbar-color: var(--signal-dim) transparent;
        scrollbar-width: thin;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--hairline);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--signal);
      }
      html {
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
        /* the header is sticky, so an anchor landing at y=0 lands underneath
           it. Every in-page link clears the header's 44px plus some air. */
        scroll-padding-top: 5rem;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        font-size: 1.0625rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      a {
        color: inherit;
      }
      ::selection {
        background: var(--signal);
        color: #fff;
      }

      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding-left: var(--pad);
        padding-right: var(--pad);
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* ---------- top bar ----------
         After apple.com's global nav: one thin full-width bar, every item
         centred in a single evenly spaced row, small light text, the
         wordmark first and two quiet icons last. The bar's own palette is
         in the --bar-* tokens so the menu sheet can share it. */
      .topbar {
        --bar-h: 44px;
        /* frosted paper: follows the page, light or dark */
        --bar-bg: var(--paper-blur);
        --bar-sheet: var(--paper);
        --bar-ink: var(--ink);
        --bar-muted: var(--ink-muted);
        --bar-line: var(--hairline);
        --bar-signal: var(--signal);
        --bar-signal-dim: var(--signal-dim);
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--bar-bg);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--bar-line);
        color: var(--bar-ink);
      }
      .topbar .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1024px;
        height: var(--bar-h);
        padding: 0 22px;
      }
      .brand {
        font-family: var(--display);
        font-weight: 600;
        letter-spacing: -0.02em;
        font-size: 1rem;
        line-height: var(--bar-h);
        text-decoration: none;
        color: var(--bar-ink);
      }
      .brand .dot {
        color: var(--bar-signal);
      }
      /* the links and icons become items of the bar itself, so
         space-between spaces the whole row evenly, Apple style */
      .nav,
      .nav-icons {
        display: contents;
      }
      .nav a,
      .nav-icons a {
        font-family: var(--body);
        font-size: 12px;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: var(--bar-h);
        text-decoration: none;
        color: var(--bar-muted);
        transition: color 0.2s ease;
      }
      .nav a:hover,
      .nav-icons a:hover {
        color: var(--bar-ink);
      }
      .nav-icons a {
        display: inline-flex;
        align-items: center;
        height: var(--bar-h);
      }
      .nav-icons svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }
      .topbar :focus-visible {
        outline: 2px solid var(--bar-signal);
        outline-offset: 2px;
        border-radius: 2px;
      }
      /* phones: six links don't fit the bar, so Contact stays one tap away
         and the rest fold into a menu that drops under the bar */
      .nav-phone {
        display: none;
        align-items: center;
        gap: 1.25rem;
      }
      .nav-contact,
      .nav-toggle {
        font-family: var(--body);
        font-size: 12px;
        text-decoration: none;
        padding: 0.6rem 0;
      }
      .nav-contact {
        color: var(--bar-signal);
      }
      .nav-toggle {
        background: none;
        border: 0;
        color: var(--bar-ink);
        cursor: pointer;
      }
      @media (max-width: 640px) {
        .topbar {
          --bar-h: 48px;
        }
        .topbar .wrap {
          padding: 0 var(--pad);
        }
        .brand {
          font-size: 1.1rem;
        }
        .nav-phone {
          display: flex;
        }
        .nav-icons {
          display: none;
        }
        .nav {
          display: none;
          position: absolute;
          top: var(--bar-h);
          left: 0;
          right: 0;
          flex-direction: column;
          gap: 0;
          padding: 0.25rem var(--pad) 0.75rem;
          background: var(--bar-sheet);
          border-bottom: 1px solid var(--bar-line);
        }
        .topbar.menu-open .nav {
          display: flex;
        }
        .nav a {
          padding: 0.95rem 0;
          font-size: 0.8rem;
          line-height: 1.4;
          color: var(--bar-ink);
        }
        .nav a + a {
          border-top: 1px solid var(--bar-line);
        }
        .nav .nav-log {
          display: none;
        }
      }

      /* ---------- hero (the HUD moment) ---------- */
      .hero {
        position: relative;
        padding-top: clamp(4rem, 12vh, 9rem);
        padding-bottom: clamp(4rem, 12vh, 8rem);
      }
      .hud-frame {
        position: absolute;
        inset: clamp(1.5rem, 6vw, 4rem) calc(var(--pad) - 0.5rem);
        pointer-events: none;
      }
      @keyframes hud-in {
        to {
          opacity: 0.55;
        }
      }
      .hud-frame span {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1.5px solid var(--signal);
        opacity: 0;
        opacity: 0;
        animation: hud-in 1s ease 0.4s forwards;
      }
      .hud-frame .tl {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
      }
      .hud-frame .tr {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
      }
      .hud-frame .bl {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
      }
      .hud-frame .br {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 20rem);
        gap: clamp(2rem, 5vw, 4.5rem);
        align-items: end;
      }
      .hero-facts {
        margin: 0 0 0.4rem;
      }
      @media (max-width: 900px) {
        .hero-grid {
          grid-template-columns: 1fr;
          align-items: start;
        }
        .hero-facts {
          margin-top: 2.6rem;
        }
      }

      .hero h1 {
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(2.5rem, 6.4vw, 5rem);
        line-height: 1.03;
        letter-spacing: -0.035em;
        margin: 0 0 1.5rem;
        text-wrap: balance;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--signal);
      }
      .hero .lede {
        font-size: clamp(1.05rem, 2.2vw, 1.3rem);
        color: var(--ink-muted);
        max-width: 46ch;
        margin: 0 0 2.4rem;
      }
      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        align-items: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.85rem 1.3rem;
        border: 1.5px solid var(--ink);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      .btn.primary {
        background: var(--ink);
        color: var(--paper);
      }
      .btn.primary:hover {
        background: var(--signal);
        border-color: var(--signal);
        color: #fff;
      }
      .btn.ghost:hover {
        border-color: var(--signal);
        color: var(--signal);
      }
      .btn:active {
        transform: translateY(1px);
      }

      /* ---------- generic section ---------- */
      .section {
        padding-top: clamp(3.5rem, 9vh, 6.5rem);
        padding-bottom: clamp(3.5rem, 9vh, 6.5rem);
        border-top: 1px solid var(--hairline);
      }
      .section-head {
        margin-bottom: 2.8rem;
      }
      .section-head .eyebrow {
        display: block;
        margin-bottom: 0.9rem;
      }
      .section-head h2 {
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(1.6rem, 3.4vw, 2.4rem);
        letter-spacing: -0.025em;
        margin: 0;
        max-width: 24ch;
      }
      .subhead {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 1.4rem;
      }

      /* ---------- about ---------- */
      .about-grid {
        max-width: 78ch;
      }
      .about-grid p {
        margin: 0 0 1.15rem;
      }
      .about-grid p:last-child {
        margin-bottom: 0;
      }

      .facts {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .fact {
        border-top: 1px solid var(--hairline);
        padding-top: 0.9rem;
      }
      .fact dt {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 0.35rem;
      }
      .fact dd {
        margin: 0;
        font-weight: 500;
      }
      @media (max-width: 760px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- work: featured ---------- */
      .featured {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
        gap: clamp(1.6rem, 3.4vw, 3rem);
      }
      .proj {
        position: relative;
        border-top: 2px solid var(--hairline);
        padding-top: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .proj::before {
        content: "";
        position: absolute;
        inset: -2px 0 auto;
        height: 2px;
        background: var(--signal);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .proj:hover::before,
      .proj:focus-within::before {
        transform: none;
      }
      .proj .tags {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }

      /* what this visitor has already opened. Remembered on their own
         device only: it never leaves the browser and never reaches Zac. */
      .proj .seen-flag {
        display: none;
        margin-left: auto;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .proj .seen-flag::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal);
      }
      .proj.seen .seen-flag {
        display: inline-flex;
      }
      .proj.seen {
        border-top-color: var(--signal);
      }
      .proj .tag {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--signal);
      }
      .proj h3 {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(1.35rem, 1.9vw, 1.65rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0.35rem 0 0;
      }
      .proj p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }
      .proj .foot {
        margin-top: auto;
        border-top: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1rem;
        margin-top: 1.4rem;
      }
      .proj .meta {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      @media (max-width: 760px) {
        .featured {
          grid-template-columns: 1fr;
        }
      }

      .repo {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink);
        border-bottom: 1px solid var(--hairline);
        padding-bottom: 2px;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
        white-space: nowrap;
      }
      .repo:hover {
        color: var(--signal);
        border-color: var(--signal);
      }
      .repo-private {
        color: var(--ink-muted);
        border-color: transparent;
        cursor: default;
      }
      .repo-private:hover {
        color: var(--ink-muted);
        border-color: transparent;
      }

      /* ---------- now ---------- */
      .now-list {
        display: flex;
        flex-direction: column;
      }
      .now-row {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 1.5rem;
        padding: 1.5rem 0;
        border-top: 1px solid var(--hairline);
      }
      .now-row:last-child {
        border-bottom: 1px solid var(--hairline);
      }
      .now-row .role {
        font-family: var(--display);
        font-weight: 500;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
      }
      .now-row .org {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--signal);
        margin-top: 0.4rem;
      }
      .now-row p {
        margin: 0;
        color: var(--ink-muted);
      }
      @media (max-width: 680px) {
        .now-row {
          grid-template-columns: 1fr;
          gap: 0.5rem;
        }
      }

      /* ---------- stack ---------- */
      .chips {
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
      }
      .chip-group {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 1.5rem;
        align-items: start;
      }
      .chip-label {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--signal);
        padding-top: 0.55rem;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .chip {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        border: 1px solid var(--hairline);
        padding: 0.5rem 0.85rem;
        color: var(--ink-muted);
        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }
      .chip:hover {
        border-color: var(--signal);
        color: var(--ink);
      }
      @media (max-width: 560px) {
        .chip-group {
          grid-template-columns: 1fr;
          gap: 0.7rem;
        }
        .chip-label {
          padding-top: 0;
        }
      }

      /* ---------- teams (sport rows reuse .chip-group / .chip-label) ---------- */
      .teams {
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
      }
      .team-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
        gap: 1.2rem clamp(1.2rem, 2.4vw, 2rem);
      }
      .team {
        display: grid;
        grid-template-columns: 36px 1fr;
        gap: 0.85rem;
        align-items: start;
        border-top: 1px solid var(--hairline);
        padding-top: 0.9rem;
      }
      .team-logo {
        width: 36px;
        height: 36px;
        object-fit: contain;
      }
      .team-name {
        font-family: var(--display);
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .team-league,
      .team-line {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        color: var(--ink-muted);
        margin-top: 0.25rem;
      }
      .team-league {
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      /* ---------- music: same rows as the teams, covers and photos ---------- */
      #music[hidden] {
        display: none;
      }
      .music-controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 0.8rem 1.6rem;
        margin-bottom: 1.8rem;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--hairline);
      }
      .seg button {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: none;
        border: 0;
        padding: 0.55rem 0.85rem;
        min-height: 36px;
        color: var(--ink-muted);
        cursor: pointer;
        transition: color 0.2s ease, background-color 0.2s ease;
      }
      .seg button + button {
        border-left: 1px solid var(--hairline);
      }
      .seg button:hover {
        color: var(--ink);
      }
      .seg button[aria-pressed="true"] {
        background: var(--signal);
        color: #fff;
      }
      .music-list a.team {
        text-decoration: none;
        color: inherit;
      }
      .music-list a.team:hover .team-name {
        color: var(--signal);
      }
      .music-list .team-logo {
        object-fit: cover;
      }
      .music-list .artist .team-logo {
        border-radius: 50%;
      }
      .music-empty {
        font-family: var(--mono);
        font-size: 0.74rem;
        color: var(--ink-muted);
      }
      .team-line b {
        font-weight: 500;
        color: var(--signal);
        margin-right: 0.4em;
      }

      @media (max-width: 600px) {
        .teams {
          gap: 1rem;
        }
        .teams .chip-group {
          gap: 0.4rem;
        }
        .team-list {
          grid-template-columns: 1fr 1fr;
          gap: 0.7rem 0.9rem;
        }
        .team {
          grid-template-columns: 24px 1fr;
          gap: 0.5rem;
          padding-top: 0.55rem;
        }
        .team-logo {
          width: 24px;
          height: 24px;
        }
        .team-name {
          font-size: 0.85rem;
          line-height: 1.2;
        }
        .team-league,
        .team-line {
          font-size: 0.6rem;
          margin-top: 0.15rem;
        }
      }

      /* ---------- thoughts ---------- */
      .thoughts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(1.6rem, 3.4vw, 3rem);
      }
      .thought {
        border-top: 2px solid var(--signal);
        padding-top: 1.2rem;
      }
      .thought .n {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(1.9rem, 3vw, 2.6rem);
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--signal);
        display: block;
        margin-bottom: 0.9rem;
      }
      .thought p {
        margin: 0;
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(1.05rem, 1.4vw, 1.18rem);
        line-height: 1.45;
        letter-spacing: -0.01em;
      }
      @media (max-width: 760px) {
        .thoughts {
          grid-template-columns: 1fr;
        }
      }


      /* ---------- the position rail ----------
         Mostly quiet dots. The section you are in blooms into one large
         numeral that rises into place and stays lit until the next section
         takes over, so the rail reads as one marker travelling down the
         page rather than seven indicators blinking on and off.
         Hidden below 1180px, where there is no margin to spare. */
      /* Both rails stay out of the way until you have actually started
         reading. They arrive on the same trigger the position rail uses, so
         they appear exactly when the first section reaches the reading line,
         and withdraw when you return to the top.
         visibility, not just opacity: an invisible rail must not collect
         keyboard focus. */
      .rail {
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.45s ease,
          translate 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          visibility 0s linear 0.45s;
      }
      .rail {
        translate: -12px 0;
      }
      body.reading .rail {
        opacity: 1;
        visibility: visible;
        translate: 0 0;
        transition-delay: 0s;
      }
      @media (prefers-reduced-motion: reduce) {
        .rail {
          translate: none;
        }
      }

      .rail {
        position: fixed;
        left: clamp(1rem, 2.4vw, 2.4rem);
        top: 50%;
        transform: translateY(-50%);
        z-index: 30;
        display: grid;
        gap: 0.5rem;
      }
      .rail a {
        display: grid;
        grid-template-columns: 6px auto;
        align-items: center;
        gap: 0.75rem;
        min-height: 1.9rem;
        text-decoration: none;
        color: var(--ink-muted);
      }
      .rail .tick {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.4;
        transition:
          transform 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          opacity 0.4s ease,
          background 0.4s ease;
      }
      .rail .rail-meta {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
        white-space: nowrap;
      }
      .rail .rail-num,
      .rail .rail-name {
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          transform 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          font-size 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          color 0.4s ease;
      }
      .rail .rail-num {
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.78rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .rail .rail-name {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transition-delay: 0.04s;
      }

      /* hover tells you what a dot is, quietly */
      .rail a:hover .rail-num,
      .rail a:hover .rail-name {
        opacity: 0.75;
        transform: none;
      }
      .rail a:hover .tick {
        opacity: 0.8;
      }

      /* the section you are in */
      .rail a[aria-current="true"] .tick {
        background: var(--signal);
        opacity: 1;
        transform: scale(1.7);
      }
      .rail a[aria-current="true"] .rail-num {
        opacity: 1;
        transform: none;
        font-size: 1.5rem;
        color: var(--signal);
      }
      .rail a[aria-current="true"] .rail-name {
        opacity: 1;
        transform: none;
        color: var(--ink);
      }

      /* the rail sits in the left margin; below ~1320px that margin is narrower than the rail
         (~160px wide at its widest), so it would cover the text. Measured 2026-09-27. */
      @media (max-width: 1319px) {
        .rail {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rail .rail-num,
        .rail .rail-name,
        .rail .tick {
          transition: none;
          transform: none;
        }
      }


      /* ---------- résumé viewer ----------
         Every link to the résumé PDF opens it here instead: PDF.js draws the
         file's pages to canvas, so the PDF itself stays the single source. */
      .rv {
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: var(--paper-2);
        color: var(--ink);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .rv::backdrop {
        background: var(--paper-2);
      }
      html:has(.rv[open]) {
        overflow: hidden;
      }
      .rv-head {
        position: sticky;
        top: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 1rem;
        height: 60px;
        padding: 0 var(--pad);
        background: var(--paper-blur);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        backdrop-filter: saturate(180%) blur(20px);
        border-bottom: 1px solid var(--hairline);
      }
      .rv-title {
        margin: 0 auto 0 0;
        font-family: var(--mono);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .rv-head .btn {
        padding: 0.6rem 1rem;
        font-size: 0.72rem;
        color: var(--ink);
      }
      .rv-close {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-right: -10px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--ink-muted);
        cursor: pointer;
      }
      .rv-close:hover {
        color: var(--signal);
      }
      .rv-close svg {
        width: 18px;
        height: 18px;
      }
      .rv :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 2px;
      }
      .rv-pages {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
        padding: 2rem var(--pad) 3rem;
      }
      .rv-page {
        position: relative;
        width: 100%;
        max-width: 850px;
        background: #fff;
        box-shadow:
          0 0 0 1px var(--hairline),
          0 12px 40px rgba(0, 0, 0, 0.08);
      }
      .rv-page canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      .rv-page a {
        position: absolute;
      }
      .rv-page a:hover {
        background: var(--signal-dim);
      }
      .rv-status {
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--ink-muted);
      }
      .rv-status a {
        color: var(--signal);
      }
      .rv-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: pre-wrap;
      }
      @media (max-width: 600px) {
        .rv-pages {
          gap: 0.75rem;
          padding: 0.75rem 0.5rem 2rem;
        }
      }

      /* ---------- the log: a drawer from the right ----------
         Opened from "Log" in the top bar at every width. It sits above the
         bar and below the entry panel, and slides fully off-screen (and out
         of the tab order) when closed. */
      .log {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 55;
        pointer-events: none;
      }
      .log-inner {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(22rem, 86vw);
        pointer-events: auto;
        background: var(--paper);
        border-left: 1px solid var(--hairline);
        box-shadow: -18px 0 40px rgba(0, 0, 0, 0.06);
        padding: 0 1.5rem 2rem;
        overflow-y: auto;
        transform: translateX(100%);
        visibility: hidden;
        transition:
          transform 0.45s cubic-bezier(0.19, 1, 0.22, 1),
          visibility 0s linear 0.45s;
      }
      .log.open .log-inner {
        transform: none;
        visibility: visible;
        transition-delay: 0s;
      }
      .log-head {
        position: sticky;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        margin-bottom: 0.75rem;
        background: var(--paper);
        border-bottom: 1px solid var(--hairline);
      }
      .log-label {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .log-close {
        appearance: none;
        background: none;
        border: 0;
        padding: 0.6rem 0;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .log-close:hover {
        color: var(--signal);
      }
      .log-items {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.9rem;
      }
      /* a month heading, then everything shipped that month */
      .log-month {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink);
        padding-top: 0.5rem;
      }
      .log-month:not(:first-child) {
        margin-top: 0.9rem;
        border-top: 1px solid var(--hairline);
        padding-top: 1.2rem;
      }
      .log-entry {
        appearance: none;
        background: none;
        border: 0;
        padding: 0;
        color: var(--ink);
        font: inherit;
        text-align: left;
        text-decoration: none;
        display: block;
        width: 100%;
        transition: color 0.3s ease;
      }
      a.log-entry,
      button.log-entry {
        cursor: pointer;
      }
      .log-when {
        display: block;
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      .log-title {
        font-family: var(--display);
        font-weight: 500;
        font-size: 1rem;
        letter-spacing: -0.01em;
      }
      .log-desc {
        display: block;
        font-size: 0.85rem;
        line-height: 1.5;
        margin-top: 0.2rem;
        color: var(--ink-muted);
      }
      .log-out {
        margin-left: 0.35rem;
        font-size: 0.8rem;
      }
      a.log-entry:hover .log-title,
      button.log-entry:hover .log-title,
      a.log-entry:focus-visible .log-title,
      button.log-entry:focus-visible .log-title {
        color: var(--signal);
      }

      /* "Log" in the top bar: the signal colour and a dot, so it reads as
         something new rather than another section jump */
      .nav-log {
        appearance: none;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        font-family: var(--body);
        font-size: 12px;
        letter-spacing: -0.01em;
        color: var(--bar-signal);
      }
      .nav-log[hidden] {
        display: none;
      }
      .nav-log-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--bar-signal);
        box-shadow: 0 0 0 3px var(--bar-signal-dim);
      }

      /* ---------- the panel ----------
         The entry opens over the page. The page dims and recedes a fraction,
         which is what reads as a sheet lifted above it. */
      .page {
        transition:
          transform 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          filter 0.5s ease;
        transform-origin: 50% 30%;
      }
      body.peek-open .page {
        transform: scale(0.985);
        filter: brightness(0.94);
      }
      body.peek-open {
        overflow: hidden;
      }

      .peek {
        position: fixed;
        inset: 0;
        z-index: 60;
      }
      .peek-scrim {
        position: absolute;
        inset: 0;
        background: rgba(10, 10, 10, 0.36);
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .peek.shown .peek-scrim {
        opacity: 1;
      }
      .peek-panel {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(46rem, 92vw);
        background: var(--paper);
        border-left: 1px solid var(--hairline);
        box-shadow: -40px 0 80px -30px rgba(10, 10, 10, 0.4);
        overflow-y: auto;
        padding: clamp(3rem, 6vw, 5rem) clamp(1.4rem, 4vw, 4rem);
        transform: translateX(100%);
        transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1);
      }
      .peek.shown .peek-panel {
        transform: none;
      }
      .peek-close {
        position: absolute;
        top: 1.4rem;
        right: 1.4rem;
        width: 2.4rem;
        height: 2.4rem;
        display: grid;
        place-items: center;
        border: 1px solid var(--hairline);
        border-radius: 50%;
        background: var(--paper);
        color: var(--ink);
        cursor: pointer;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }
      .peek-close svg {
        width: 15px;
        height: 15px;
      }
      .peek-close:hover {
        background: var(--ink);
        color: var(--paper);
      }
      .peek-when {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--signal);
        display: block;
        margin-bottom: 1rem;
      }
      .peek-body h2 {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(1.8rem, 3.4vw, 2.6rem);
        letter-spacing: -0.03em;
        line-height: 1.05;
        margin: 0 0 1.2rem;
      }
      .peek-lede {
        font-size: 1.1rem;
        margin: 0 0 1.8rem;
        max-width: 58ch;
      }
      .peek-report {
        border-top: 1px solid var(--hairline);
        padding-top: 1.8rem;
      }
      .peek-report p {
        margin: 0 0 1.15rem;
        color: var(--ink-muted);
        max-width: 66ch;
      }
      .peek-empty {
        color: var(--ink-muted);
        font-style: italic;
      }
      @media (prefers-reduced-motion: reduce) {
        .page,
        .peek-scrim,
        .peek-panel,
        .log-inner,
        .log-title {
          transition: none;
        }
        body.peek-open .page {
          transform: none;
        }
      }

      /* ---------- contact ----------
         The page exists to earn an email, so this block gets the weight: a
         dark field, and the signal reserved for the one action that matters. */
      .contact {
        background: var(--field);
        color: var(--field-ink);
        border-top: none;
        padding-top: clamp(5rem, 13vh, 9rem);
        padding-bottom: clamp(5rem, 13vh, 9rem);
      }
      .contact .eyebrow {
        color: var(--field-muted);
      }
      .contact h2 {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(2.3rem, 7vw, 4.6rem);
        letter-spacing: -0.035em;
        margin: 0 0 2.4rem;
        max-width: 16ch;
        line-height: 1.02;
      }
      .contact-links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        align-items: center;
      }
      .contact .btn.primary {
        background: var(--signal);
        color: #fff;
        border-color: var(--signal);
      }
      .contact .btn.primary:hover {
        background: #fff;
        color: var(--field);
        border-color: #fff;
      }
      .contact .btn.ghost {
        color: var(--field-ink);
        border-color: var(--field-rule);
      }
      .contact .btn.ghost:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: var(--field-ink);
      }
      .contact :focus-visible {
        outline-color: var(--field-ink);
      }

      /* ---------- footer ---------- */
      footer {
        border-top: 1px solid var(--hairline);
        padding: 2rem 0;
      }
      footer .wrap {
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 1rem;
      }
      footer .mono {
        font-size: 0.66rem;
      }

      /* ---------- about as a text thread (phones + iPads) ---------- */
      .thread {
        display: none;
      }
      @media (max-width: 1024px) {
        #about-body {
          display: none;
        }
        .thread {
          display: flex;
          flex-direction: column;
          max-width: 34rem;
        }
      }
      .thread .when {
        font: 400 0.68rem var(--mono);
        color: var(--ink-muted);
        text-align: center;
        margin: 0 0 0.8rem;
      }
      .bub {
        max-width: 82%;
        width: fit-content;
        padding: 0.55rem 0.9rem;
        border-radius: 1.2rem;
        font-size: 1rem;
        line-height: 1.38;
        margin: 0 0 0.3rem;
        opacity: 0;
        transform: translateY(10px) scale(0.96);
        transition:
          opacity 0.35s ease,
          transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .bub.in {
        opacity: 1;
        transform: none;
      }
      .bub.them {
        background: var(--paper-2);
        color: var(--ink);
        transform-origin: left bottom;
      }
      .bub.me {
        background: var(--signal);
        color: #fff;
        margin-left: auto;
        transform-origin: right bottom;
      }
      .bub.them + .bub.me,
      .bub.me + .bub.them {
        margin-top: 0.6rem;
      }
      .bub.them.tail {
        border-bottom-left-radius: 0.35rem;
      }
      .bub.me.tail {
        border-bottom-right-radius: 0.35rem;
      }
      .thread .read {
        font: 400 0.68rem var(--mono);
        color: var(--ink-muted);
        text-align: right;
        margin: 0.1rem 0.15rem 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .bub {
          opacity: 1;
          transform: none;
          transition: none;
        }
      }

      /* ---------- scroll reveal ---------- */
      .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .reveal.in {
        opacity: 1;
        transform: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .hud-frame span {
          animation: none;
          opacity: 0.55;
        }
        html {
          scroll-behavior: auto;
        }
      }

      :focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 3px;
      }

      /* ---------- phones: tighter rhythm. Desktop spacing reads as dead air on a small screen ---------- */
      @media (max-width: 640px) {
        .hero {
          padding-top: 3rem;
          padding-bottom: 3rem;
        }
        .hud-frame {
          inset: 1rem calc(var(--pad) - 0.5rem);
        }
        .hero .lede {
          margin-bottom: 1.8rem;
        }
        /* the main action full width, the two secondary ones sharing a row */
        .hero-cta {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 0.6rem;
        }
        .hero-cta .btn {
          justify-content: center;
          padding: 0.8rem 0.5rem;
          font-size: 0.7rem;
          letter-spacing: 0.08em;
        }
        .hero-cta .btn.primary {
          grid-column: 1 / -1;
        }
        .hero-facts {
          margin-top: 2rem;
        }
        .facts {
          gap: 0.9rem;
        }
        .fact {
          padding-top: 0.7rem;
        }
        .section {
          padding-top: 2.75rem;
          padding-bottom: 2.75rem;
        }
        .section-head {
          margin-bottom: 1.6rem;
        }
        .featured {
          gap: 1.8rem;
        }
        .proj .foot {
          margin-top: 0.3rem;
          padding-top: 0.75rem;
        }
        .chips {
          gap: 1.2rem;
        }
        .chip-row {
          gap: 0.4rem;
        }
        .chip {
          padding: 0.35rem 0.6rem;
          font-size: 0.7rem;
        }

        /* bar: brand, the Log dot and a menu icon. Contact lives in the menu and the hero */
        .nav-contact {
          display: none;
        }
        .nav-toggle {
          position: relative;
          width: 44px;
          height: 44px;
          margin-right: -10px;
          padding: 0;
          font-size: 0; /* the "Menu"/"Close" text stays as the accessible name */
        }
        .nav-toggle::before,
        .nav-toggle::after {
          content: "";
          position: absolute;
          left: 11px;
          right: 11px;
          height: 1.5px;
          background: var(--bar-ink);
          transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav-toggle::before {
          top: 18px;
        }
        .nav-toggle::after {
          top: 25px;
        }
        .topbar.menu-open .nav-toggle::before {
          transform: translateY(3.5px) rotate(45deg);
        }
        .topbar.menu-open .nav-toggle::after {
          transform: translateY(-3.5px) rotate(-45deg);
        }

        /* menu: a full-height sheet of big, numbered section links */
        .nav {
          counter-reset: n;
          height: calc(100dvh - var(--bar-h));
          overflow-y: auto;
          padding: 1.25rem var(--pad) 2rem;
          border-bottom: 0;
        }
        .topbar.menu-open .nav {
          animation: menu-in 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .nav a {
          counter-increment: n;
          display: flex;
          align-items: baseline;
          gap: 1rem;
          padding: 0.85rem 0;
          font-family: var(--display);
          font-size: 1.9rem;
          font-weight: 500;
          letter-spacing: -0.025em;
          text-transform: none;
        }
        .nav a::before {
          content: counter(n, decimal-leading-zero);
          font-family: var(--mono);
          font-size: 0.7rem;
          letter-spacing: 0.14em;
          color: var(--signal);
        }
      }
      @keyframes menu-in {
        from {
          opacity: 0;
          transform: translateY(-8px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .topbar.menu-open .nav {
          animation: none;
        }
        .nav-toggle::before,
        .nav-toggle::after {
          transition: none;
        }
      }

      /* ---------- apple-ish sections (mockup branch) ---------- */
      .section-head h2 { font-size: clamp(2.8rem, 7.5vw, 5.6rem); letter-spacing: -0.045em; line-height: 0.98; }
      .spring { transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s; }
      .spring:hover { transform: translateY(-6px) scale(1.012); box-shadow: 0 22px 48px rgba(0, 0, 0, 0.14); }
      @media (prefers-reduced-motion: reduce) { .spring, .spring:hover { transition: none; transform: none; } }

      /* D: bento work grid */
      #featured.bento { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: minmax(210px, auto); gap: 16px; }
      .bento .proj { border: 0; border-radius: 26px; padding: 26px; background: color-mix(in srgb, var(--ink) 5%, var(--paper)); justify-content: flex-end; }
      .bento .proj::before { display: none; }
      .bento .proj .foot { border-top-color: color-mix(in srgb, var(--ink) 12%, transparent); }
      .bento .proj:nth-child(1) { grid-column: span 2; grid-row: span 2; background: linear-gradient(140deg, #3a35ff, #8f5bff); color: #fff; }
      .bento .proj:nth-child(1) h3 { font-size: clamp(2.2rem, 4vw, 3.4rem); }
      .bento .proj:nth-child(1) p, .bento .proj:nth-child(1) .meta, .bento .proj:nth-child(1) .tag { color: #e6e4ff; }
      .bento .proj:nth-child(1) a { color: #fff; }
      .bento .proj:nth-child(2) { grid-column: span 2; }
      @media (max-width: 760px) { #featured.bento { grid-template-columns: 1fr; } .bento .proj:nth-child(n) { grid-column: auto; grid-row: auto; } }

      /* E: keynote-dark forks */
      #forks.keynote { background: #000; color: #f5f5f7; }
      #forks.keynote .eyebrow { color: #a1a1a6; }
      #forks.keynote h2 .grad { background: linear-gradient(90deg, #8f8bff, #ff7ad9, #ffb86b); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #forks.keynote .proj { border: 0; border-radius: 26px; padding: 30px; background: #1d1d1f; }
      #forks.keynote .proj::before { display: none; }
      #forks.keynote .proj p, #forks.keynote .meta { color: #a1a1a6; }
      #forks.keynote .tag { color: #8f8bff; }
      #forks.keynote .proj .foot { border-top-color: #333; }
      #forks.keynote a { color: #f5f5f7; }

      /* F: widget obsessions */
      #thoughts.widgets { background: linear-gradient(180deg, color-mix(in srgb, var(--signal) 12%, var(--paper)), color-mix(in srgb, #ff7ad9 8%, var(--paper))); }
      .widgets .thoughts { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 220px)); gap: 18px; }
      .widgets .thought { aspect-ratio: 1; border-radius: 28px; padding: 20px; border: 0;
        background: color-mix(in srgb, var(--paper) 70%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        display: flex; flex-direction: column; justify-content: space-between; }
      .widgets .thought .n { font-size: 1rem; }
      .widgets .thought p { font-size: 1rem; line-height: 1.35; }

      /* ---------- hero 1 + chips ---------- */
      .hero-grid { display: block; text-align: center; }
      .hero-name { font: 500 1.25rem var(--display); color: var(--ink-muted); margin: 0 0 0.6rem; }
      .hero h1 { font-size: clamp(2.4rem, 9vw, 7rem); letter-spacing: -0.05em; line-height: 0.96; margin-inline: auto; }
      .hero h1 em { font-style: normal; display: block; background: linear-gradient(90deg, #8f8bff, #ff7ad9, #ffb86b); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .hero .lede { margin-inline: auto; max-width: 640px; }
      .hero-cta { justify-content: center; }
      .hero-facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 2.2rem auto 0; border: 0; }
      .hero-facts .fact { background: color-mix(in srgb, var(--ink) 6%, var(--paper)); border-radius: 16px; padding: 12px 16px; text-align: left; border: 0; }
      .hero-facts .fact dt { font-size: 0.72rem; color: var(--ink-muted); }
      .hero-facts .fact dd { margin: 0; font-weight: 600; }

      /* ---------- swipe rows (timeline, teams) ---------- */
      .sc { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 10px; scrollbar-width: thin; }
      .sc > * { scroll-snap-align: start; flex: 0 0 auto; }
      .timeline .step { width: 250px; border-radius: 24px; padding: 22px; background: color-mix(in srgb, var(--ink) 5%, var(--paper)); }
      .timeline .step .when { font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
      .timeline .step h3 { font: 600 1.35rem/1.15 var(--display); margin: 0.5rem 0; letter-spacing: -0.02em; }
      .timeline .step p { margin: 0; color: var(--ink-muted); font-size: 0.94rem; }
      .timeline .step.now { background: linear-gradient(140deg, #3a35ff, #8f5bff); color: #fff; }
      .timeline .step.now .when, .timeline .step.now p { color: #e6e4ff; }

      .sport-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
      .sport-tabs button { font: 600 0.9rem var(--body, inherit); padding: 9px 18px; border-radius: 99px; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); background: none; color: var(--ink); cursor: pointer; }
      .sport-tabs button[aria-selected="true"] { background: var(--signal); border-color: var(--signal); color: #fff; }
      #teams-grid { display: block; }
      .tcard { width: 250px; border-radius: 24px; padding: 22px; color: #fff; display: flex; flex-direction: column; gap: 22px;
        background: linear-gradient(160deg, var(--tc), color-mix(in srgb, var(--tc) 35%, #000)); }
      .tcard .team-logo { width: 88px; height: 88px; object-fit: contain; padding: 12px; border-radius: 50%; background: rgba(255, 255, 255, 0.94); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35); }
      .tcard .team-name { font: 600 1.3rem var(--display); }
      .tcard .team-league, .tcard .team-live { color: rgba(255, 255, 255, 0.78); font-size: 0.85rem; }
      .tcard .team-line b { color: #fff; margin-right: 6px; }

      #teams-grid .sport[hidden] { display: none; }
      .hero .hero-facts { display: flex !important; flex-direction: row; max-width: 900px; }
      .hero .hero-facts .fact { flex: 0 1 auto; width: auto; max-width: 100%; border-bottom: 0; display: block; }
      /* ---------- music grid ---------- */
      .music-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
      .art { display: block; color: var(--ink); text-decoration: none; }
      .art img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; display: block; background: color-mix(in srgb, var(--ink) 8%, var(--paper)); }
      .art b { display: block; margin-top: 8px; font-weight: 600; }

      /* ---------- contact: apple footer ---------- */
      #contact-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; border-top: 1px solid var(--hairline); padding-top: 24px; margin-top: 2rem; }
      .ccol { display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; }
      .ccol a { color: var(--ink-muted); text-decoration: none; }
      .ccol a:hover { color: var(--signal); }
      @media (max-width: 560px) { #contact-links { grid-template-columns: 1fr 1fr; } }

      /* ---------- round 3 fixes ---------- */
      /* about: a row you swipe, snapping to whole squares; 4 show on desktop, 2 on phones */
      .timeline.sc { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 3 * 14px) / 4); gap: 14px;
        overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0; overscroll-behavior-x: contain; padding-bottom: 12px; }
      @media (max-width: 760px) { .timeline.sc { grid-auto-columns: calc((100% - 14px) / 2); } }
      .timeline .step { width: auto; min-width: 0; aspect-ratio: 1; scroll-snap-align: start; overflow-wrap: anywhere; display: flex; flex-direction: column; justify-content: space-between; padding: 18px; }
      .timeline .step h3 { font-size: 1.1rem; margin: 0 0 0.3rem; }
      .timeline .step p { font-size: 0.84rem; line-height: 1.35; }
      .art { text-align: center; }
      .art img { border-radius: 50%; }
      .seg { border: 0; gap: 8px; display: inline-flex; flex-wrap: wrap; }
      .seg button { border-radius: 99px !important; border: 1px solid color-mix(in srgb, var(--ink) 18%, transparent) !important; padding: 9px 18px; font: 600 0.9rem system-ui, sans-serif; letter-spacing: 0; text-transform: none; }
      .seg button[aria-pressed="true"] { background: var(--signal); border-color: var(--signal) !important; color: #fff; }
      .sc-nav { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
      .sc-nav button { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; font-size: 1.3rem; line-height: 1;
        background: color-mix(in srgb, var(--ink) 9%, var(--paper)); color: var(--ink); transition: opacity 0.2s; }
      .sc-nav button:disabled { opacity: 0.3; cursor: default; }
      .sc-nav button:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
      .timeline.sc { scrollbar-width: none; } .timeline.sc::-webkit-scrollbar { display: none; }


      /* ---------- placement pass ---------- */
      .hero-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px 30px; margin-top: 2rem; }
      .hero-links .lnk { color: var(--signal); font-weight: 600; font-size: 1.08rem; text-decoration: none; }
      .hero-links .lnk span { display: inline-block; transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }
      .hero-links .lnk:hover span { transform: translateX(4px); }
      .hero-links .lnk:hover { text-decoration: underline; text-underline-offset: 4px; }

      /* soft labels instead of typewriter caps */
      .eyebrow, .proj .tag, .proj .meta, .repo, .hero-facts .fact dt, .timeline .step .when, .team-league, .thought .n {
        font-family: system-ui, -apple-system, sans-serif !important; text-transform: none !important; letter-spacing: 0 !important; }
      .eyebrow { font-size: 0.9rem; color: var(--ink-muted); }
      .proj .tag { font-size: 0.78rem; font-weight: 600; }
      .proj .meta, .repo { font-size: 0.82rem; }
      .hero-facts .fact dt, .timeline .step .when { font-size: 0.78rem; }
      .team-league { font-size: 0.85rem; }

      /* Brain's tile gets its app icon */
      .bento .proj[data-id="brain"]::after { content: ""; position: absolute; top: 28px; left: 28px; width: 84px; height: 84px; border-radius: 20px;
        background: url(assets/brain-icon.png) center / cover; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3); }
      /* and a peek at the app itself, top right, bleeding off the edge */
      .bento .proj[data-id="brain"] { overflow: hidden; }
      .bento .proj[data-id="brain"]::before { display: block; content: ""; position: absolute; top: 28px; right: -18%; width: 62%; aspect-ratio: 1440 / 913; height: auto; left: auto; bottom: auto; transform: none; transition: none;
        background: url(assets/brain-front-page.png) top left / cover; border-radius: 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35); pointer-events: none; }

      /* obsessions across the full width */
      .widgets .thoughts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .widgets .thought { aspect-ratio: 16 / 10; }

      .team-line, .team-line b, footer .mono, .proj .seen-flag {
        font-family: system-ui, -apple-system, sans-serif !important; text-transform: none !important; letter-spacing: 0 !important; }
      .team-line { font-size: 0.82rem; }
      footer .mono { font-size: 0.85rem; }
      .proj .seen-flag { font-size: 0.75rem; }


      /* ---------- critique pass ---------- */
      /* gradient text only paints inside its box: give descenders (the y in "yet.") room, without moving the layout */
      .hero h1 em { padding-bottom: 0.16em; margin-bottom: -0.16em; }
      #forks.keynote h2 .grad { display: inline-block; padding-bottom: 0.14em; margin-bottom: -0.14em; }
      .contact { background: color-mix(in srgb, var(--ink) 4%, var(--paper)); color: var(--ink); border-top: 1px solid var(--hairline); }
      .contact .eyebrow { color: var(--ink-muted); }
      /* music: one row of circles; swipe if there are more */
      .music-grid { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: calc((100% - 7 * 14px) / 8);
        gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 6px; }
      .music-grid::-webkit-scrollbar { display: none; }
      .music-grid .art { scroll-snap-align: start; min-width: 0; }
      .art b { font-size: 0.82rem; line-height: 1.25; }
      @media (max-width: 760px) { .music-grid { grid-auto-columns: calc((100% - 3 * 12px) / 4); gap: 12px; } }

      /* ---------- phone pass ---------- */
      @media (max-width: 760px) {
        .section { padding-top: 2.6rem; padding-bottom: 2.6rem; }
        .section-head h2 { font-size: clamp(2.2rem, 11vw, 3rem); }
        .widgets .thoughts { grid-template-columns: 1fr; gap: 10px; }
        .widgets .thought { aspect-ratio: auto; flex-direction: row; align-items: baseline; justify-content: flex-start; gap: 14px; padding: 16px 18px; border-radius: 20px; }
        .art b { font-size: 0.8rem; margin-top: 6px; }
        .hero-links { gap: 8px 22px; margin-top: 1.4rem; }
        .bento .proj[data-id="brain"] { padding-top: 124px; }
        .bento .proj[data-id="brain"]::after { top: 24px; left: 24px; width: 76px; height: 76px; border-radius: 18px; }
        .bento .proj[data-id="brain"]::before { display: none; }
        .hero-links .lnk { font-size: 0.98rem; }
        /* all three buttons on one row, same size */
        .hero-cta { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
        .hero-cta .btn.primary { grid-column: auto; }
        .hero-cta .btn { font-size: 0.6rem; letter-spacing: 0.04em; padding: 0.8rem 0.25rem; text-align: center; white-space: nowrap; }
        .hero .hero-facts { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory;
          margin-inline: -20px; padding: 0 20px 6px; scroll-padding: 0 20px; scrollbar-width: none; }
        .hero .hero-facts::-webkit-scrollbar { display: none; }
        .hero .hero-facts .fact { flex: 0 0 auto; scroll-snap-align: start; white-space: nowrap; }
      }

      /* ---------- sections B: quieter, apple-style, fewer tiles ---------- */
      /* sections flow into each other: no divider lines, tighter gaps */
      .section { border-top: 0 !important; }
      .section { padding-top: 40px !important; padding-bottom: 40px !important; }

            return new Set(); // storage unavailable: the page simply forgets

        function writeSeen(set) {

           on this origin. Escape on the way into markup, and allowlist any
           value that becomes a URL. */
        const esc = (v) =>

                "'": "&#39;",

        // script-bearing schemes do not

          if (/^(javascript|data|vbscript|file):/i.test(u)) return "#";
          if (/^(https?:|mailto:|tel:|[#./])/i.test(u)) return u;
          if (/^[\w.-]+\//.test(u)) return u; // bare relative path

        };

        const btnStyle = (v) => (v === "primary" ? "primary" : "ghost");

        const monthLabel = (key) => {

          if (!m) return String(key);
          return `${MONTH_NAMES[Number(m[2]) - 1]} ${m[1]}`;

        function render() {

          // two quiet icons close the bar, taken from the Contact links
          const ICONS = {

            resume: '<path d="M4 0h5.5L14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2Zm5 1.5V5h3.5L9 1.5ZM5 8h6v1.2H5V8Zm0 2.6h6v1.2H5v-1.2Zm0-5.2h2.5v1.2H5V5.4Z"/>',

          // the facts lead the page now; they still live under about in the

            .join("");

          $("#about-body").innerHTML = SITE.about.paragraphs

            "queen-s-web-dev": `<div class="stats"><div><b>10</b><span>weekly tutorials</span></div><div><b>7</b><span>on the team</span></div><div><b>1</b><span>new site</span></div></div>`,
          };
          $("#featured").innerHTML = SITE.work.featured

          applySeen();

          renderLog(items);
