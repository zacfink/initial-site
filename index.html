<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Zac Finkelstein</title>
    <meta
      name="description"
      content="Zac Finkelstein — computer science at Queen's, AI consultant at RBC Dominion Securities, co-chair of Queen's Web Dev. I find the slow, manual work and kill it."
    />
    <link rel="canonical" href="https://zacfinkelstein.ca/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.85em' font-size='70' font-weight='600' font-family='system-ui,sans-serif' fill='%233a35ff'>Z.</text></svg>"
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zacfinkelstein.ca/" />
    <meta property="og:site_name" content="Zac Finkelstein" />
    <meta property="og:title" content="Zac Finkelstein" />
    <meta
      property="og:description"
      content="CS at Queen's, AI consultant at RBC Dominion Securities. I find the slow, manual work and kill it."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Zac Finkelstein" />
    <meta
      name="twitter:description"
      content="CS at Queen's, AI consultant at RBC Dominion Securities. I find the slow, manual work and kill it."
    />

    <style>
      :root {
        --paper: #ffffff;
        --paper-2: #f5f6f7;
        --paper-blur: rgba(255, 255, 255, 0.82);
        --ink: #0a0a0a;
        --ink-muted: #5a5f66;
        --hairline: #e3e5e8;
        --signal: #3a35ff;
        --signal-dim: rgba(58, 53, 255, 0.16);
        --field: #0a0a0a;
        --field-ink: #ffffff;
        --field-muted: rgba(255, 255, 255, 0.62);
        --field-rule: rgba(255, 255, 255, 0.28);

        --display: "Space Grotesk", system-ui, sans-serif;
        --body: "IBM Plex Sans", system-ui, sans-serif;
        --mono: "IBM Plex Mono", ui-monospace, monospace;

        --pad: clamp(1.25rem, 5vw, 4rem);
        --maxw: 1080px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0b0c0e;
          --paper-2: #14161a;
          --paper-blur: rgba(11, 12, 14, 0.82);
          --ink: #f2f3f5;
          --ink-muted: #9aa0a8;
          --hairline: #242830;
          --signal: #6f6bff;
          --signal-dim: rgba(111, 107, 255, 0.22);
          --field: #171a20;
          --field-ink: #f2f3f5;
          --field-muted: rgba(242, 243, 245, 0.62);
          --field-rule: rgba(242, 243, 245, 0.26);
        }
      }

      * {
        box-sizing: border-box;
      }

      /* the surfaces the browser draws still belong to the design */
      ::selection {
        background: var(--signal);
        color: #fff;
      }
      html {
        caret-color: var(--signal);
        scrollbar-color: var(--signal-dim) transparent;
        scrollbar-width: thin;
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--hairline);
        border-radius: 99px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--signal);
      }
      html {
        scrollbar-gutter: stable;
        scroll-behavior: smooth;
        /* the header is sticky, so an anchor landing at y=0 lands underneath
           it. Every in-page link clears the header's 60px plus some air. */
        scroll-padding-top: 5rem;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--body);
        font-size: 1.0625rem;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      a {
        color: inherit;
      }
      ::selection {
        background: var(--signal);
        color: #fff;
      }

      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding-left: var(--pad);
        padding-right: var(--pad);
      }

      .mono {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }

      /* ---------- top bar ---------- */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--paper-blur);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--hairline);
      }
      .topbar .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
      }
      .brand {
        font-family: var(--display);
        font-weight: 600;
        letter-spacing: -0.02em;
        font-size: 1.15rem;
        text-decoration: none;
      }
      .brand .dot {
        color: var(--signal);
      }
      .nav {
        display: flex;
        gap: 1.75rem;
      }
      .nav a {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink-muted);
        transition: color 0.2s ease;
      }
      .nav a:hover {
        color: var(--signal);
      }
      /* phones: six links don't fit the bar, so Contact stays one tap away
         and the rest fold into a menu that drops under the bar */
      .nav-phone {
        display: none;
        align-items: center;
        gap: 1.25rem;
      }
      .nav-contact,
      .nav-toggle {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.6rem 0;
      }
      .nav-contact {
        color: var(--signal);
      }
      .nav-toggle {
        background: none;
        border: 0;
        color: var(--ink);
        cursor: pointer;
      }
      @media (max-width: 640px) {
        .nav-phone {
          display: flex;
        }
        .nav {
          display: none;
          position: absolute;
          top: 60px;
          left: 0;
          right: 0;
          flex-direction: column;
          gap: 0;
          padding: 0.25rem var(--pad) 0.75rem;
          background: var(--paper);
          border-bottom: 1px solid var(--hairline);
        }
        .topbar.menu-open .nav {
          display: flex;
        }
        .nav a {
          padding: 0.95rem 0;
          font-size: 0.8rem;
          color: var(--ink);
        }
        .nav a + a {
          border-top: 1px solid var(--hairline);
        }
        .nav .nav-log {
          display: none;
        }
      }

      /* ---------- hero (the HUD moment) ---------- */
      .hero {
        position: relative;
        padding-top: clamp(4rem, 12vh, 9rem);
        padding-bottom: clamp(4rem, 12vh, 8rem);
      }
      .hud-frame {
        position: absolute;
        inset: clamp(1.5rem, 6vw, 4rem) calc(var(--pad) - 0.5rem);
        pointer-events: none;
      }
      @keyframes hud-in {
        to {
          opacity: 0.55;
        }
      }
      .hud-frame span {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1.5px solid var(--signal);
        opacity: 0;
        opacity: 0;
        animation: hud-in 1s ease 0.4s forwards;
      }
      .hud-frame .tl {
        top: 0;
        left: 0;
        border-right: 0;
        border-bottom: 0;
      }
      .hud-frame .tr {
        top: 0;
        right: 0;
        border-left: 0;
        border-bottom: 0;
      }
      .hud-frame .bl {
        bottom: 0;
        left: 0;
        border-right: 0;
        border-top: 0;
      }
      .hud-frame .br {
        bottom: 0;
        right: 0;
        border-left: 0;
        border-top: 0;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 20rem);
        gap: clamp(2rem, 5vw, 4.5rem);
        align-items: end;
      }
      .hero-facts {
        margin: 0 0 0.4rem;
      }
      @media (max-width: 900px) {
        .hero-grid {
          grid-template-columns: 1fr;
          align-items: start;
        }
        .hero-facts {
          margin-top: 2.6rem;
        }
      }

      .hero h1 {
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(2.5rem, 6.4vw, 5rem);
        line-height: 1.03;
        letter-spacing: -0.035em;
        margin: 0 0 1.5rem;
        text-wrap: balance;
      }
      .hero h1 em {
        font-style: normal;
        color: var(--signal);
      }
      .hero .lede {
        font-size: clamp(1.05rem, 2.2vw, 1.3rem);
        color: var(--ink-muted);
        max-width: 46ch;
        margin: 0 0 2.4rem;
      }
      .hero-cta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        align-items: center;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--mono);
        font-size: 0.78rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        padding: 0.85rem 1.3rem;
        border: 1.5px solid var(--ink);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }
      .btn.primary {
        background: var(--ink);
        color: var(--paper);
      }
      .btn.primary:hover {
        background: var(--signal);
        border-color: var(--signal);
        color: #fff;
      }
      .btn.ghost:hover {
        border-color: var(--signal);
        color: var(--signal);
      }
      .btn:active {
        transform: translateY(1px);
      }

      /* ---------- generic section ---------- */
      .section {
        padding-top: clamp(3.5rem, 9vh, 6.5rem);
        padding-bottom: clamp(3.5rem, 9vh, 6.5rem);
        border-top: 1px solid var(--hairline);
      }
      .section-head {
        margin-bottom: 2.8rem;
      }
      .section-head .eyebrow {
        display: block;
        margin-bottom: 0.9rem;
      }
      .section-head h2 {
        font-family: var(--display);
        font-weight: 500;
        font-size: clamp(1.6rem, 3.4vw, 2.4rem);
        letter-spacing: -0.025em;
        margin: 0;
        max-width: 24ch;
      }
      .subhead {
        font-family: var(--mono);
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin: 0 0 1.4rem;
      }

      /* ---------- about ---------- */
      .about-grid {
        max-width: 78ch;
      }
      .about-grid p {
        margin: 0 0 1.15rem;
      }
      .about-grid p:last-child {
        margin-bottom: 0;
      }

      .facts {
        display: flex;
        flex-direction: column;
        gap: 1.4rem;
      }
      .fact {
        border-top: 1px solid var(--hairline);
        padding-top: 0.9rem;
      }
      .fact dt {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-muted);
        margin-bottom: 0.35rem;
      }
      .fact dd {
        margin: 0;
        font-weight: 500;
      }
      @media (max-width: 760px) {
        .about-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- work: featured ---------- */
      .featured {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr));
        gap: clamp(1.6rem, 3.4vw, 3rem);
      }
      .proj {
        position: relative;
        border-top: 2px solid var(--hairline);
        padding-top: 1.2rem;
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .proj::before {
        content: "";
        position: absolute;
        inset: -2px 0 auto;
        height: 2px;
        background: var(--signal);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .proj:hover::before,
      .proj:focus-within::before {
        transform: none;
      }
      .proj .tags {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
        align-items: center;
      }

      /* what this visitor has already opened. Remembered on their own
         device only: it never leaves the browser and never reaches Zac. */
      .proj .seen-flag {
        display: none;
        margin-left: auto;
        align-items: center;
        gap: 0.4rem;
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
        white-space: nowrap;
      }
      .proj .seen-flag::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--signal);
      }
      .proj.seen .seen-flag {
        display: inline-flex;
      }
      .proj.seen {
        border-top-color: var(--signal);
      }
      .proj .tag {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--signal);
      }
      .proj h3 {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(1.35rem, 1.9vw, 1.65rem);
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin: 0.35rem 0 0;
      }
      .proj p {
        margin: 0;
        color: var(--ink-muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }
      .proj .foot {
        margin-top: auto;
        border-top: 1px solid var(--hairline);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-top: 1rem;
        margin-top: 1.4rem;
      }
      .proj .meta {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-muted);
      }
      @media (max-width: 760px) {
        .featured {
          grid-template-columns: 1fr;
        }
      }

      .repo {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        color: var(--ink);
        border-bottom: 1px solid var(--hairline);
        padding-bottom: 2px;
        transition:
          color 0.2s ease,
          border-color 0.2s ease;
        white-space: nowrap;
      }
      .repo:hover {
        color: var(--signal);
        border-color: var(--signal);
      }
      .repo-private {
        color: var(--ink-muted);
        border-color: transparent;
        cursor: default;
      }
      .repo-private:hover {
        color: var(--ink-muted);
        border-color: transparent;
      }

      /* ---------- now ---------- */
      .now-list {
        display: flex;
        flex-direction: column;
      }
      .now-row {
        display: grid;
        grid-template-columns: 200px 1fr;
        gap: 1.5rem;
        padding: 1.5rem 0;
        border-top: 1px solid var(--hairline);
      }
      .now-row:last-child {
        border-bottom: 1px solid var(--hairline);
      }
      .now-row .role {
        font-family: var(--display);
        font-weight: 500;
        font-size: 1.15rem;
        letter-spacing: -0.01em;
      }
      .now-row .org {
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--signal);
        margin-top: 0.4rem;
      }
      .now-row p {
        margin: 0;
        color: var(--ink-muted);
      }
      @media (max-width: 680px) {
        .now-row {
          grid-template-columns: 1fr;
          gap: 0.5rem;
        }
      }

      /* ---------- stack ---------- */
      .chips {
        display: flex;
        flex-direction: column;
        gap: 1.8rem;
      }
      .chip-group {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 1.5rem;
        align-items: start;
      }
      .chip-label {
        font-family: var(--mono);
        font-size: 0.66rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--signal);
        padding-top: 0.55rem;
      }
      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .chip {
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0.06em;
        border: 1px solid var(--hairline);
        padding: 0.5rem 0.85rem;
        color: var(--ink-muted);
        transition:
          border-color 0.2s ease,
          color 0.2s ease;
      }
      .chip:hover {
        border-color: var(--signal);
        color: var(--ink);
      }
      @media (max-width: 560px) {
        .chip-group {
          grid-template-columns: 1fr;
          gap: 0.7rem;
        }
        .chip-label {
          padding-top: 0;
        }
      }

      /* ---------- thoughts ---------- */
      .thoughts {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: clamp(1.6rem, 3.4vw, 3rem);
      }
      .thought {
        border-top: 2px solid var(--signal);
        padding-top: 1.2rem;
      }
      .thought .n {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(1.9rem, 3vw, 2.6rem);
        letter-spacing: -0.04em;
        line-height: 1;
        color: var(--signal);
        display: block;
        margin-bottom: 0.9rem;
      }
      .thought p {
        margin: 0;
        font-family: var(--display);
        font-weight: 400;
        font-size: clamp(1.05rem, 1.4vw, 1.18rem);
        line-height: 1.45;
        letter-spacing: -0.01em;
      }
      @media (max-width: 760px) {
        .thoughts {
          grid-template-columns: 1fr;
        }
      }


      /* ---------- the position rail ----------
         Mostly quiet dots. The section you are in blooms into one large
         numeral that rises into place and stays lit until the next section
         takes over, so the rail reads as one marker travelling down the
         page rather than seven indicators blinking on and off.
         Hidden below 1180px, where there is no margin to spare. */
      /* Both rails stay out of the way until you have actually started
         reading. They arrive on the same trigger the position rail uses, so
         they appear exactly when the first section reaches the reading line,
         and withdraw when you return to the top.
         visibility, not just opacity: an invisible rail must not collect
         keyboard focus. */
      .rail {
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.45s ease,
          translate 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          visibility 0s linear 0.45s;
      }
      .rail {
        translate: -12px 0;
      }
      body.reading .rail {
        opacity: 1;
        visibility: visible;
        translate: 0 0;
        transition-delay: 0s;
      }
      @media (prefers-reduced-motion: reduce) {
        .rail {
          translate: none;
        }
      }

      .rail {
        position: fixed;
        left: clamp(1rem, 2.4vw, 2.4rem);
        top: 50%;
        transform: translateY(-50%);
        z-index: 30;
        display: grid;
        gap: 0.5rem;
      }
      .rail a {
        display: grid;
        grid-template-columns: 6px auto;
        align-items: center;
        gap: 0.75rem;
        min-height: 1.9rem;
        text-decoration: none;
        color: var(--ink-muted);
      }
      .rail .tick {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.4;
        transition:
          transform 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          opacity 0.4s ease,
          background 0.4s ease;
      }
      .rail .rail-meta {
        display: flex;
        align-items: baseline;
        gap: 0.55rem;
        white-space: nowrap;
      }
      .rail .rail-num,
      .rail .rail-name {
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          transform 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          font-size 0.5s cubic-bezier(0.19, 1, 0.22, 1),
          color 0.4s ease;
      }
      .rail .rail-num {
        font-family: var(--display);
        font-weight: 600;
        font-size: 0.78rem;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .rail .rail-name {
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        transition-delay: 0.04s;
      }

      /* hover tells you what a dot is, quietly */
      .rail a:hover .rail-num,
      .rail a:hover .rail-name {
        opacity: 0.75;
        transform: none;
      }
      .rail a:hover .tick {
        opacity: 0.8;
      }

      /* the section you are in */
      .rail a[aria-current="true"] .tick {
        background: var(--signal);
        opacity: 1;
        transform: scale(1.7);
      }
      .rail a[aria-current="true"] .rail-num {
        opacity: 1;
        transform: none;
        font-size: 1.5rem;
        color: var(--signal);
      }
      .rail a[aria-current="true"] .rail-name {
        opacity: 1;
        transform: none;
        color: var(--ink);
      }

      @media (max-width: 1180px) {
        .rail {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .rail .rail-num,
        .rail .rail-name,
        .rail .tick {
          transition: none;
          transform: none;
        }
      }


      /* ---------- the log: a drawer from the right ----------
         Opened from "Log" in the top bar at every width. It sits above the
         bar and below the entry panel, and slides fully off-screen (and out
         of the tab order) when closed. */
      .log {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;

        const SEEN_KEY = "zf:work-seen";

        const slug = (t) =>
          String(t)
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, "-")
            .replace(/^-|-$/g, "");

        function readSeen() {
          try {
            const raw = localStorage.getItem(SEEN_KEY);
            const list = raw ? JSON.parse(raw) : [];
            return new Set(Array.isArray(list) ? list : []);
          } catch {
            return new Set(); // storage unavailable: the page simply forgets
          }
        }

        function writeSeen(set) {
          try {
            localStorage.setItem(SEEN_KEY, JSON.stringify([...set]));
          } catch {
            /* nothing to do: the marker is a convenience, not state we own */
          }
        }

        function applySeen() {
          const seen = readSeen();
          document.querySelectorAll("#featured .proj").forEach((el) => {
            el.classList.toggle("seen", seen.has(el.dataset.id));

           write policy would otherwise turn edited text into script running
           on this origin. Escape on the way into markup, and allowlist any
           value that becomes a URL. */
        const esc = (v) =>
          String(v ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );

        // http(s), mailto, tel, fragments and relative paths pass; the
        // script-bearing schemes do not
        const safeUrl = (v) => {
          const u = String(v ?? "").trim();
          if (/^(javascript|data|vbscript|file):/i.test(u)) return "#";
          if (/^(https?:|mailto:|tel:|[#./])/i.test(u)) return u;
          if (/^[\w.-]+\//.test(u)) return u; // bare relative path
          return "#";
        };

        const repo = (url, label) =>
          url
            ? `<a class="repo" href="${esc(safeUrl(url))}" target="_blank" rel="noopener">${esc(label || "Repo")} ↗</a>`
            : `<span class="repo repo-private">Private</span>`;

        /* ---------- sections, numbering and the rail ----------
           Section numbers are derived from document order, never typed, so
           inserting or hiding a section renumbers the page and the rail
           together and they cannot drift apart. */
        const SECTIONS = [
          "about",
          "work",
          "now",
          "stack",
          "thoughts",
          "contact",
        ];

        // "01 — About" and "Monthly" both yield "About" / "Monthly"
        const labelOf = (eyebrow, fallback) => {
          const m = String(eyebrow || "").match(/^\s*(?:\d+\s*[—–-]\s*)?(.+?)\s*$/);
          return m ? m[1] : fallback;
        };

        const MONTH_NAMES = [
          "January", "February", "March", "April", "May", "June",
          "July", "August", "September", "October", "November", "December",
        ];

        const monthlyItems = () =>
          Array.isArray(SITE.monthly && SITE.monthly.items)
            ? SITE.monthly.items.filter((i) => i && i.month && i.title)
            : [];

        const whenLabel = (key) => {
          const m = String(key).match(/^(\d{4})-(\d{2})$/);
          if (!m) return String(key);
          return `${MONTH_NAMES[Number(m[2]) - 1].slice(0, 3)} ${m[1]}`;
        };
        const monthLabel = (key) => {
          const m = String(key).match(/^(\d{4})-(\d{2})$/);
          if (!m) return String(key);
          return `${MONTH_NAMES[Number(m[2]) - 1]} ${m[1]}`;
        };

        function render() {
          const items = monthlyItems();
          const active = SECTIONS;

          active.forEach((id, i) => {
            const n = String(i + 1).padStart(2, "0");
            const label = labelOf(SITE[id] && SITE[id].eyebrow, id);
            const el = document.getElementById(id + "-eyebrow");
            if (el) el.textContent = `${n} — ${label}`;
          });

          $("#rail").innerHTML = active
            .map((id, i) => {
              const n = String(i + 1).padStart(2, "0");
              const label = labelOf(SITE[id] && SITE[id].eyebrow, id);
              return `<a href="#${id}" data-target="${id}" aria-current="false"><span class="tick"></span><span class="rail-meta"><span class="rail-num">${n}</span><span class="rail-name">${esc(label)}</span></span></a>`;
            })
            .join("");

          $("#brand").innerHTML = `${esc(SITE.brand)}<span class="dot">.</span>`;
          $("#nav").innerHTML = SITE.nav
            .map((n) => `<a href="${esc(safeUrl(n.href))}">${esc(n.label)}</a>`)
            .join("") +
            `<button class="nav-log" type="button" data-open-log aria-controls="log" aria-expanded="false" hidden><span class="nav-log-dot" aria-hidden="true"></span><span class="nav-log-label">Log</span></button>`;
          // the phone shortcut follows whichever nav item points at #contact
          const contactLink = SITE.nav.find((n) => n.href === "#contact");
          $("#nav-contact").hidden = !contactLink;
          if (contactLink) $("#nav-contact").textContent = contactLink.label;

          // hero
          $("#hero-headline").innerHTML =
            `${esc(SITE.hero.headlineLead)}<em>${esc(SITE.hero.headlineAccent)}</em>`;
          $("#hero-lede").textContent = SITE.hero.lede;
          $("#hero-cta").innerHTML = SITE.hero.ctas.map(btn).join("");
          // the facts lead the page now; they still live under about in the
          // content object, so the published row keeps its shape


          // about
          $("#about-heading").textContent = SITE.about.heading;
          $("#about-body").innerHTML = SITE.about.paragraphs
            .map((p) => `<p>${esc(p)}</p>`)
            .join("");
          $("#hero-facts").innerHTML = SITE.about.facts
            .map(
              (f) =>
                `<div class="fact"><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`,
            )
            .join("");

          // work
          $("#work-heading").textContent = SITE.work.heading;
          $("#featured").innerHTML = SITE.work.featured
            .map(
              (p) => `
      <article class="proj" data-id="${slug(p.title)}">
        <div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}<span class="seen-flag">Viewed</span></div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc)}</p>
        <div class="foot"><span class="meta">${esc(p.meta || "")}</span>${repo(p.repo, p.linkLabel)}</div>
      </article>`,
            )
            .join("");

          // now
          $("#now-heading").textContent = SITE.now.heading;
          $("#now-list").innerHTML = SITE.now.roles
            .map(
              (r) => `
      <div class="now-row">
        <div><div class="role">${esc(r.role)}</div><div class="org">${esc(r.org)}</div></div>
        <p>${esc(r.desc)}</p>
      </div>`,
            )
            .join("");

          // stack
          $("#stack-heading").textContent = SITE.stack.heading;
          $("#chips").innerHTML = SITE.stack.groups
            .map(
              (g) => `
      <div class="chip-group">
        <span class="chip-label">${esc(g.label)}</span>
        <div class="chip-row">${g.items.map((it) => `<span class="chip">${esc(it)}</span>`).join("")}</div>
      </div>`,
            )
            .join("");

          // thoughts
          $("#thoughts-heading").textContent = SITE.thoughts.heading;
          $("#thoughts-grid").innerHTML = SITE.thoughts.items
            .map(
              (t) =>
                `<div class="thought"><span class="n">${esc(t.n)}</span><p>${esc(t.text)}</p></div>`,
            )
            .join("");

          // contact
          $("#contact-heading").textContent = SITE.contact.heading;
          $("#contact-links").innerHTML = SITE.contact.links.map(btn).join("");

          applySeen();

          renderLog(items);
          syncRail();

          // footer — availability is set as copy, not bolted on as a badge
          $("#footer-left").textContent = SITE.footer.left;
          $("#footer-right").textContent = SITE.footer.right;
        }

        render();

        /* The accordion and the rail are wired once, on containers that
           render() refills but never replaces. */
        /* ---------- the log and its panel ----------
           Entries live in a drawer opened from "Log" in the top bar, and long
           ones open in the panel over it. There is no section for them, so
           the bar button is the only way in and it hides itself when there
           is nothing to show. */
        let peekReturn = null;
        let peekHideTimer = null;

        function renderLog(items) {
          const log = $("#log");
          log.hidden = items.length === 0;
          document.querySelectorAll("[data-open-log]").forEach((b) => {
            b.hidden = items.length === 0;
          });
          if (!items.length) return;

          const label = (SITE.monthly && SITE.monthly.label) || "Log";
          $("#log-label").textContent = label;
          document
            .querySelectorAll(".nav-log-label")
            .forEach((el) => (el.textContent = label));

          // newest month first; within a month, the order they were written in
          const ordered = items
            .map((m, i) => [m, i])
            .sort(
              ([a, ai], [b, bi]) =>
                String(b.month).localeCompare(String(a.month)) || ai - bi,
            )
            .map(([m]) => m);

          const entry = (m, i) => {
            const inner = `
          <span class="log-when">${esc(m.kind || "")}</span>
          <span class="log-title">${esc(m.title)}</span>${m.href ? `<span class="log-out" aria-hidden="true">↗</span>` : ""}${m.desc ? `
          <span class="log-desc">${esc(m.desc)}</span>` : ""}`;
            const href = m.href ? safeUrl(m.href) : "#";
            if (href !== "#")
              return `<a class="log-entry" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
            if (Array.isArray(m.body) && m.body.length)
              return `<button class="log-entry" type="button" data-i="${i}">${inner}</button>`;
            return `<span class="log-entry">${inner}</span>`;
          };

          let html = "";
          let month = null;
          ordered.forEach((m, i) => {
            if (m.month !== month) {
              month = m.month;
              html += `<li class="log-month">${esc(monthLabel(m.month))}</li>`;
            }
            html += `<li>${entry(m, i)}</li>`;
          });
          $("#log-items").innerHTML = html;

          $("#log-items").dataset.json = JSON.stringify(ordered);
        }

        function openPeek(entry, trigger) {
          if (peekHideTimer) {
            clearTimeout(peekHideTimer);
            peekHideTimer = null;
          }
          peekReturn = trigger || null;
          const hasReport = Array.isArray(entry.body) && entry.body.length > 0;

          $("#peek-body").innerHTML = `
            <span class="peek-when">${esc(whenLabel(entry.month))}${entry.kind ? ` · ${esc(entry.kind)}` : ""}</span>
            <h2 id="peek-title">${esc(entry.title)}</h2>
            ${entry.desc ? `<p class="peek-lede">${esc(entry.desc)}</p>` : ""}
            ${
              hasReport
                ? `<div class="peek-report">${entry.body.map((par) => `<p>${esc(par)}</p>`).join("")}</div>`
                : `<p class="peek-empty">Not written yet.</p>`
            }
            ${entry.href ? `<p><a class="repo" href="${esc(safeUrl(entry.href))}" target="_blank" rel="noopener">Open ↗</a></p>` : ""}`;

          const peek = $("#peek");
          peek.hidden = false;
          document.body.classList.add("peek-open");
          // one frame so the transition has a start state to move from
          requestAnimationFrame(() => peek.classList.add("shown"));
          setTimeout(() => peek.classList.add("shown"), 30); // if frames are throttled
          $("#peek-panel").scrollTop = 0;
          $("#peek-close").focus();
        }

        function closePeek() {
          const peek = $("#peek");
          if (peek.hidden) return;
          peek.classList.remove("shown");
          document.body.classList.remove("peek-open");
          // hold the id: reopening inside the exit transition must cancel
          // this, or the panel hides itself while the page stays locked
          peekHideTimer = setTimeout(() => {
            peek.hidden = true;
            peekHideTimer = null;
          }, 420);
          if (peekReturn && document.contains(peekReturn)) peekReturn.focus();
          peekReturn = null;
        }

        $("#log-items").addEventListener("click", (e) => {
          const b = e.target.closest("button[data-i]");
          if (!b) return;
          let list = [];
          try {
            list = JSON.parse($("#log-items").dataset.json || "[]");
          } catch {
            return;
          }
          const entry = list[Number(b.dataset.i)];
          if (entry) openPeek(entry, b);
        });

        function setMenu(open) {
          document.querySelector(".topbar").classList.toggle("menu-open", open);
          $("#nav-toggle").setAttribute("aria-expanded", String(open));
          $("#nav-toggle").textContent = open ? "Close" : "Menu";
        }
        $("#nav-toggle").addEventListener("click", () =>
          setMenu($("#nav-toggle").getAttribute("aria-expanded") !== "true"),
        );
        // a jump, a tap outside the bar, or Escape closes the menu
        $("#nav").addEventListener("click", (e) => {
          if (e.target.closest("a")) setMenu(false);
        });
        $("#nav-contact").addEventListener("click", () => setMenu(false));
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".topbar")) setMenu(false);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#nav-toggle").getAttribute("aria-expanded") === "true") {
            setMenu(false);
            $("#nav-toggle").focus();
          }
        });

        let logReturn = null;
        const logOpen = () => $("#log").classList.contains("open");
        function setLog(open, trigger) {
          $("#log").classList.toggle("open", open);
          document
            .querySelectorAll("[data-open-log]")
            .forEach((b) => b.setAttribute("aria-expanded", String(open)));
          if (open) {
            setMenu(false);
            logReturn = trigger || null;
            $("#log-close").focus({ preventScroll: true });
          } else if (logReturn && document.contains(logReturn)) {
            logReturn.focus({ preventScroll: true });
            logReturn = null;
          }
        }
        $("#log-close").addEventListener("click", () => setLog(false));
        // the bar buttons are re-rendered with the nav, so listen on the page;
        // a click anywhere outside the drawer (and not in the entry panel) closes it
        document.addEventListener("click", (e) => {
          const trigger = e.target.closest("[data-open-log]");
          if (trigger) return setLog(!logOpen(), trigger);
          if (logOpen() && !e.target.closest(".log-inner, .peek")) setLog(false);
        });

        $("#peek-close").addEventListener("click", closePeek);
        $("#peek-scrim").addEventListener("click", closePeek);

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (!$("#peek").hidden) closePeek();
            else if (logOpen()) setLog(false);
            return;
          }
          if (e.key !== "Tab" || $("#peek").hidden) return;
          // keep focus inside the dialog while it is open
          const focusables = $("#peek-panel").querySelectorAll(
            'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])',
          );
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        });

        /* Rail position, from the same scroll pass idea as everything else:
           the section whose top has most recently passed the reading line
           wins. If this never runs the rail simply never highlights, which
           costs the reader nothing. */
        function syncRail() {
          const links = [...document.querySelectorAll("#rail a")];
          if (!links.length) return;
          const line = window.innerHeight * 0.35;
          // nothing is lit until a section has actually reached the reading
          // line, so the rail stays quiet dots while you are still in the hero
          let current = null;
          links.forEach((a) => {
            const el = document.getElementById(a.dataset.target);
            if (el && !el.hidden && el.getBoundingClientRect().top <= line) {
              current = a.dataset.target;
            }
          });
          /* The last section is shorter than the space below the reading
             line, so its top can never reach it. At the bottom of the page
             the final section is the one you are in, by definition. */
          const doc = document.documentElement;
          if (window.innerHeight + window.scrollY >= doc.scrollHeight - 2) {
            current = links[links.length - 1].dataset.target;
          }

          // both rails ride on this: nothing in view means nothing on screen
          document.body.classList.toggle("reading", Boolean(current));

          links.forEach((a) =>
            a.setAttribute(
              "aria-current",
              a.dataset.target === current ? "true" : "false",
            ),
          );
        }

        let railTick = false;
        const onRailScroll = () => {
          if (railTick) return;
          railTick = true;
          requestAnimationFrame(() => {
            syncRail();
            railTick = false;
          });
        };
        window.addEventListener("scroll", onRailScroll, { passive: true });
        window.addEventListener("resize", onRailScroll, { passive: true });
        syncRail();

        // delegated on #featured, which render() refills but never replaces
        $("#featured").addEventListener("click", (e) => {
          const card = e.target.closest(".proj");
          if (!card || !card.dataset.id) return;
          const seen = readSeen();
          if (seen.has(card.dataset.id)) return;
          seen.add(card.dataset.id);
          writeSeen(seen);
          card.classList.add("seen");
        });

        /* ---------- published content ----------
           The SITE object above is the copy that ships with this file: it
           renders instantly and stands on its own if the request below never
           lands. Supabase holds an editable copy of the same shape, so edits
           made in the table editor reach the site with no commit and no
           deploy. Setup lives in supabase/schema.sql. */
        const CONTENT = {
          url: "https://pstkmidnowzkfwinktqn.supabase.co",
          anonKey: "sb_publishable_QgpbTzYlJd4J4s9VvQAkjA_SYr5IJfH",
          row: "live",
        };

        async function loadPublishedContent() {
          if (CONTENT.anonKey.startsWith("YOUR-")) return; // not wired up yet

          let data;
          try {
            const res = await fetch(
              `${CONTENT.url}/rest/v1/site_content?id=eq.${CONTENT.row}&select=data`,
              {
                cache: "no-store",
                headers: {
                  apikey: CONTENT.anonKey,
                  authorization: `Bearer ${CONTENT.anonKey}`,
                },
              },
            );
            if (!res.ok) return;
            const rows = await res.json();
            data = Array.isArray(rows) && rows[0] ? rows[0].data : null;
          } catch {
            return; // offline or blocked — the shipped copy stays on screen
          }
          if (!data || typeof data !== "object") return;

          const shipped = SITE;
          try {
            SITE = { ...shipped, ...data };
            render();
          } catch (err) {
            SITE = shipped; // a bad edit can't take the page down
            render();
            console.warn("Published content didn't render; kept shipped copy.", err);
          }
        }

        loadPublishedContent();

        // scroll reveal — runs after content is in the DOM
        const reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (!reduce && "IntersectionObserver" in window) {
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add("in");
                  io.unobserve(e.target);
                }
              });
            },
            { threshold: 0.12 },
          );
          document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
        } else {
          document
            .querySelectorAll(".reveal")
            .forEach((el) => el.classList.add("in"));
        }
      })();
    </script>
  </body>
</html>
