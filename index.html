        render();

        /* The accordion and the rail are wired once, on containers that
           render() refills but never replaces. */
        /* ---------- the log and its panel ----------
           Entries live in a drawer opened from "Log" in the top bar, and long
           ones open in the panel over it. There is no section for them, so
           the bar button is the only way in and it hides itself when there
           is nothing to show. */
        let peekReturn = null;
        let peekHideTimer = null;

        function renderLog(items) {
          const log = $("#log");
          log.hidden = items.length === 0;
          document.querySelectorAll("[data-open-log]").forEach((b) => {
            b.hidden = items.length === 0;
          });
          if (!items.length) return;

          const label = (SITE.monthly && SITE.monthly.label) || "Log";
          $("#log-label").textContent = label;
          document
            .querySelectorAll(".nav-log-label")
            .forEach((el) => (el.textContent = label));

          // newest month first; within a month, the order they were written in
          const ordered = items
            .map((m, i) => [m, i])
            .sort(
              ([a, ai], [b, bi]) =>
                String(b.month).localeCompare(String(a.month)) || ai - bi,
            )
            .map(([m]) => m);

          const entry = (m, i) => {
            const inner = `
          <span class="log-when">${esc(m.kind || "")}</span>
          <span class="log-title">${esc(m.title)}</span>${m.href ? `<span class="log-out" aria-hidden="true">↗</span>` : ""}${m.desc ? `
          <span class="log-desc">${esc(m.desc)}</span>` : ""}`;
            const href = m.href ? safeUrl(m.href) : "#";
            if (href !== "#")
              return `<a class="log-entry" href="${esc(href)}" target="_blank" rel="noopener noreferrer">${inner}</a>`;
            if (Array.isArray(m.body) && m.body.length)
              return `<button class="log-entry" type="button" data-i="${i}">${inner}</button>`;
            return `<span class="log-entry">${inner}</span>`;
          };

          let html = "";
          let month = null;
          ordered.forEach((m, i) => {
            if (m.month !== month) {
              month = m.month;
              html += `<li class="log-month">${esc(monthLabel(m.month))}</li>`;
            }
            html += `<li>${entry(m, i)}</li>`;
          });
          $("#log-items").innerHTML = html;

          $("#log-items").dataset.json = JSON.stringify(ordered);
        }

        function openPeek(entry, trigger) {
          if (peekHideTimer) {
            clearTimeout(peekHideTimer);
            peekHideTimer = null;
          }
          peekReturn = trigger || null;
          const hasReport = Array.isArray(entry.body) && entry.body.length > 0;

          $("#peek-body").innerHTML = `
            <span class="peek-when">${esc(whenLabel(entry.month))}${entry.kind ? ` · ${esc(entry.kind)}` : ""}</span>
            <h2 id="peek-title">${esc(entry.title)}</h2>
            ${entry.desc ? `<p class="peek-lede">${esc(entry.desc)}</p>` : ""}
            ${
              hasReport
                ? `<div class="peek-report">${entry.body.map((par) => `<p>${esc(par)}</p>`).join("")}</div>`
                : `<p class="peek-empty">Not written yet.</p>`
            }
            ${entry.href ? `<p><a class="repo" href="${esc(safeUrl(entry.href))}" target="_blank" rel="noopener">Open ↗</a></p>` : ""}`;

          const peek = $("#peek");
          peek.hidden = false;
          document.body.classList.add("peek-open");
          // one frame so the transition has a start state to move from
          requestAnimationFrame(() => peek.classList.add("shown"));
          setTimeout(() => peek.classList.add("shown"), 30); // if frames are throttled
          $("#peek-panel").scrollTop = 0;
          $("#peek-close").focus();
        }

        function closePeek() {
          const peek = $("#peek");
          if (peek.hidden) return;
          peek.classList.remove("shown");
          document.body.classList.remove("peek-open");
          // hold the id: reopening inside the exit transition must cancel
          // this, or the panel hides itself while the page stays locked
          peekHideTimer = setTimeout(() => {
            peek.hidden = true;
            peekHideTimer = null;
          }, 420);
          if (peekReturn && document.contains(peekReturn)) peekReturn.focus();
          peekReturn = null;
        }

        $("#log-items").addEventListener("click", (e) => {
          const b = e.target.closest("button[data-i]");
          if (!b) return;
          let list = [];
          try {
            list = JSON.parse($("#log-items").dataset.json || "[]");
          } catch {
            return;
          }
          const entry = list[Number(b.dataset.i)];
          if (entry) openPeek(entry, b);
        });

        function setMenu(open) {
          document.querySelector(".topbar").classList.toggle("menu-open", open);
          $("#nav-toggle").setAttribute("aria-expanded", String(open));
          $("#nav-toggle").textContent = open ? "Close" : "Menu";
        }
        $("#nav-toggle").addEventListener("click", () =>
          setMenu($("#nav-toggle").getAttribute("aria-expanded") !== "true"),
        );
        // a jump, a tap outside the bar, or Escape closes the menu
        $("#nav").addEventListener("click", (e) => {
          if (e.target.closest("a")) setMenu(false);
        });
        $("#nav-contact").addEventListener("click", () => setMenu(false));
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".topbar")) setMenu(false);
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && $("#nav-toggle").getAttribute("aria-expanded") === "true") {
            setMenu(false);
            $("#nav-toggle").focus();
          }
        });

        let logReturn = null;
        const logOpen = () => $("#log").classList.contains("open");
        function setLog(open, trigger) {
          $("#log").classList.toggle("open", open);
          document
            .querySelectorAll("[data-open-log]")
            .forEach((b) => b.setAttribute("aria-expanded", String(open)));
          if (open) {
            setMenu(false);
            logReturn = trigger || null;
            $("#log-close").focus({ preventScroll: true });
          } else if (logReturn && document.contains(logReturn)) {
            logReturn.focus({ preventScroll: true });
            logReturn = null;
          }
        }
        $("#log-close").addEventListener("click", () => setLog(false));
        // the bar buttons are re-rendered with the nav, so listen on the page;
        // a click anywhere outside the drawer (and not in the entry panel) closes it
        document.addEventListener("click", (e) => {
          const trigger = e.target.closest("[data-open-log]");
          if (trigger) return setLog(!logOpen(), trigger);
          if (logOpen() && !e.target.closest(".log-inner, .peek")) setLog(false);
        });

        $("#peek-close").addEventListener("click", closePeek);
        $("#peek-scrim").addEventListener("click", closePeek);

        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            if (!$("#peek").hidden) closePeek();
            else if (logOpen()) setLog(false);
            return;
          }
          if (e.key !== "Tab" || $("#peek").hidden) return;
          // keep focus inside the dialog while it is open
          const focusables = $("#peek-panel").querySelectorAll(
            'a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])',
          );
          if (!focusables.length) return;
          const first = focusables[0];
          const last = focusables[focusables.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        });

        /* ---------- résumé viewer ----------
           Any link to the résumé PDF opens the in-site viewer. PDF.js loads on
           first open; pages render to canvas with the PDF's own links laid on
           top and its text kept for screen readers. Modifier-clicks still get
           the raw file. Back, Esc and the X all close it. */
        const rv = $("#rv");
        let rvSrc = null;
        let pdfjsReady = null;
        const loadPdfjs = () =>
          (pdfjsReady ||= new Promise((ok, fail) => {
            const s = document.createElement("script");
            s.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
            s.integrity = "sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e";
            s.crossOrigin = "anonymous";
            s.onload = () => {
              pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
              ok(pdfjsLib);
            };
            s.onerror = () => {
              pdfjsReady = null;
              s.remove();
              fail(new Error("pdf.js failed to load"));
            };
            document.head.appendChild(s);
          }));

        async function renderResume(src) {
          const box = $("#rv-pages");
          box.innerHTML = `<p class="rv-status">Loading résumé…</p>`;
          try {
            const lib = await loadPdfjs();
            const pdf = await lib.getDocument(src).promise;
            const frag = document.createDocumentFragment();
            // ponytail: drawn once at open-time width (2x for pinch, capped);
            // re-render on resize if a rotated phone ever looks soft
            const px = Math.min(2400, Math.ceil(Math.min(850, innerWidth) * (devicePixelRatio || 1) * 2));
            for (let n = 1; n <= pdf.numPages; n++) {
              const page = await pdf.getPage(n);
              const base = page.getViewport({ scale: 1 });
              const vp = page.getViewport({ scale: px / base.width });
              const wrap = document.createElement("div");
              wrap.className = "rv-page";
              const canvas = document.createElement("canvas");
              canvas.width = Math.floor(vp.width);
              canvas.height = Math.floor(vp.height);
              canvas.setAttribute("aria-hidden", "true");
              wrap.appendChild(canvas);
              await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
              const text = await page.getTextContent();
              const sr = document.createElement("div");
              sr.className = "rv-sr";
              sr.textContent =
                (pdf.numPages > 1 ? `Page ${n} of ${pdf.numPages}. ` : "") +
                text.items.map((t) => t.str + (t.hasEOL ? "\n" : "")).join("");
              wrap.appendChild(sr);
              for (const a of await page.getAnnotations()) {
                const url = a.subtype === "Link" && a.url && safeUrl(a.url);
                if (!url || url === "#") continue;
                const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
                const link = document.createElement("a");
                link.href = url;
                link.target = "_blank";
                link.rel = "noopener";
                link.setAttribute("aria-label", url.replace(/^mailto:|^https?:\/\/(www\.)?/, ""));
                Object.assign(link.style, {
                  left: `${(Math.min(x1, x2) / vp.width) * 100}%`,
                  top: `${(Math.min(y1, y2) / vp.height) * 100}%`,
                  width: `${(Math.abs(x2 - x1) / vp.width) * 100}%`,
                  height: `${(Math.abs(y2 - y1) / vp.height) * 100}%`,
                });
                wrap.appendChild(link);
              }
              frag.appendChild(wrap);
            }
            box.replaceChildren(frag);
            rvSrc = src;
          } catch {
            box.innerHTML = `<p class="rv-status">Couldn't show the résumé here. <a href="${esc(src)}">Open the PDF</a>.</p>`;
          }
        }

        function openResume(src, push = true) {
          $("#rv-download").href = src;
          if (!rv.open) {
            setMenu(false);
            if (logOpen()) setLog(false);
            rv.showModal();
            $("#rv-close").focus();
            if (push) history.pushState({ resume: true }, "", "#resume");
          }
          if (rvSrc !== src) renderResume(src);
        }
        function closeResume() {
          if (!rv.open) return;
          if (history.state && history.state.resume) history.back(); // popstate closes it
          else {
            rv.close();
            if (location.hash === "#resume") history.replaceState(null, "", location.pathname + location.search);
          }
        }
        addEventListener("popstate", () => {
          const want = !!(history.state && history.state.resume);
          if (rv.open && !want) rv.close();
          else if (!rv.open && want) openResume($("#rv-download").href, false);
        });
        rv.addEventListener("cancel", (e) => {
          e.preventDefault();
          closeResume();
        });
        $("#rv-close").addEventListener("click", closeResume);
        document.addEventListener("click", (e) => {
          const a = e.target.closest('a[href$="resume.pdf"]');
          if (!a || a.id === "rv-download" || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          rvReturn = a;
          openResume(a.href);
        });
        // Safari never focuses a clicked link, so hand focus back explicitly
        let rvReturn = null;
        rv.addEventListener("close", () => {
          if (rvReturn && document.contains(rvReturn)) rvReturn.focus({ preventScroll: true });
          rvReturn = null;
        });
        if (location.hash === "#resume") openResume(new URL("assets/resume.pdf", location.href).href, false);

        /* Rail position, from the same scroll pass idea as everything else:
           the section whose top has most recently passed the reading line
           wins. If this never runs the rail simply never highlights, which
           costs the reader nothing. */
        function syncRail() {
          const links = [...document.querySelectorAll("#rail a")];
          if (!links.length) return;
          const line = window.innerHeight * 0.35;
          // nothing is lit until a section has actually reached the reading
          // line, so the rail stays quiet dots while you are still in the hero
          let current = null;
          links.forEach((a) => {
            const el = document.getElementById(a.dataset.target);
            if (el && !el.hidden && el.getBoundingClientRect().top <= line) {
              current = a.dataset.target;
            }
          });
          /* The last section is shorter than the space below the reading
             line, so its top can never reach it. At the bottom of the page
             the final section is the one you are in, by definition. */
          const doc = document.documentElement;
          if (window.innerHeight + window.scrollY >= doc.scrollHeight - 2) {
            current = links[links.length - 1].dataset.target;
          }

          // both rails ride on this: nothing in view means nothing on screen
          document.body.classList.toggle("reading", Boolean(current));

          links.forEach((a) =>
            a.setAttribute(
              "aria-current",
              a.dataset.target === current ? "true" : "false",
            ),
          );
        }

        let railTick = false;
        const onRailScroll = () => {
          if (railTick) return;
          railTick = true;
          requestAnimationFrame(() => {
            syncRail();
            railTick = false;
          });
        };
        window.addEventListener("scroll", onRailScroll, { passive: true });
        window.addEventListener("resize", onRailScroll, { passive: true });
        syncRail();

        // delegated on #featured, which render() refills but never replaces
        $("#featured").addEventListener("click", (e) => {
          const card = e.target.closest(".proj");
          if (!card || !card.dataset.id) return;
          const seen = readSeen();
          if (seen.has(card.dataset.id)) return;
          seen.add(card.dataset.id);
          writeSeen(seen);
          card.classList.add("seen");
        });

        /* ---------- published content ----------
           The SITE object above is the copy that ships with this file: it
           renders instantly and stands on its own if the request below never
           lands. Supabase holds an editable copy of the same shape, so edits
           made in the table editor reach the site with no commit and no
           deploy. Setup lives in supabase/schema.sql. */
        const CONTENT = {
          url: "https://pstkmidnowzkfwinktqn.supabase.co",
          anonKey: "sb_publishable_QgpbTzYlJd4J4s9VvQAkjA_SYr5IJfH",
          row: "live",
        };

        async function loadPublishedContent() {
          if (CONTENT.anonKey.startsWith("YOUR-")) return; // not wired up yet

          let data;
          try {
            const res = await fetch(
              `${CONTENT.url}/rest/v1/site_content?id=eq.${CONTENT.row}&select=data`,
              {
                cache: "no-store",
                headers: {
                  apikey: CONTENT.anonKey,
                  authorization: `Bearer ${CONTENT.anonKey}`,
                },
              },
            );
            if (!res.ok) return;
            const rows = await res.json();
            data = Array.isArray(rows) && rows[0] ? rows[0].data : null;
          } catch {
            return; // offline or blocked — the shipped copy stays on screen
          }
          if (!data || typeof data !== "object") return;

          const shipped = SITE;
          try {
            SITE = { ...shipped, ...data };
            render();
          } catch (err) {
            SITE = shipped; // a bad edit can't take the page down
            render();
            console.warn("Published content didn't render; kept shipped copy.", err);
          }
        }

        loadPublishedContent();

        /* ---------- teams ----------
           Hard-coded here, not in Supabase. Each card renders name + logo
           straight away; the live line (next game, last score) is filled in
           from a public feed if one exists and answers. Both feeds send
           Access-Control-Allow-Origin: *. Teams with no feed stay static. */
        const ESPN = "https://site.api.espn.com/apis/site/v2/sports/";
        const LOGO = "https://a.espncdn.com/i/teamlogos/";
        const TEAMS = [
          { sport: "Football", teams: [
            { name: "Green Bay Packers", league: "NFL", logo: LOGO + "nfl/500/gb.png", espn: "football/nfl/teams/gb" },
            { name: "Queen's Gaels", league: "U Sports", logo: "assets/teams/queens-gaels.svg" },
            { name: "Michigan State Spartans", league: "NCAA", logo: LOGO + "ncaa/500/127.png", espn: "football/college-football/teams/127" },
          ] },
          { sport: "Basketball", teams: [
            { name: "Toronto Raptors", league: "NBA", logo: LOGO + "nba/500/tor.png", espn: "basketball/nba/teams/tor" },
            { name: "Sacramento Kings", league: "NBA", logo: LOGO + "nba/500/sac.png", espn: "basketball/nba/teams/sac" },
            { name: "Toronto Tempo", league: "WNBA", logo: LOGO + "wnba/500/tor.png", espn: "basketball/wnba/teams/131935" },
          ] },
          { sport: "Hockey", teams: [
            { name: "Toronto Maple Leafs", league: "NHL", logo: LOGO + "nhl/500/tor.png", espn: "hockey/nhl/teams/tor" },
            { name: "Team Canada", league: "International", logo: LOGO + "countries/500/can.png" },
          ] },
          { sport: "Soccer", teams: [
            { name: "Toronto FC", league: "MLS", logo: LOGO + "soccer/500/7318.png", espn: "soccer/usa.1/teams/7318" },
          ] },
          { sport: "F1", teams: [
            { name: "McLaren", league: "Formula 1", logo: "assets/teams/mclaren.svg", f1: "mclaren" },
          ] },
        ];

        // timed = false: ESPN has only the day (its placeholder is midnight Eastern)
        const when = (iso, timed = true) =>
          new Date(iso).toLocaleString("en-CA", timed
            ? { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }
            : { weekday: "short", month: "short", day: "numeric", timeZone: "America/New_York" });
        const line = (label, text) =>
          `<div class="team-line"><b>${esc(label)}</b>${esc(text)}</div>`;
        const getJSON = async (url) => {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.status);
          return res.json();
        };

        async function espnLines(path) {
          const d = await getJSON(ESPN + path + "/schedule");
          const id = d.team.id;
          const games = (d.events || [])
            .map((e) => {
              const c = e.competitions[0];
              const us = c.competitors.find((x) => x.team.id === id);
              const them = c.competitors.find((x) => x !== us);
              return { date: e.date, timed: e.timeValid !== false, state: c.status.type.state, done: c.status.type.completed, us, them };
            })
            .filter((g) => g.us && g.them)
            .sort((a, b) => a.date.localeCompare(b.date));
          const vs = (g) => `${g.us.homeAway === "away" ? "@" : "vs"} ${g.them.team.abbreviation}`;
          const next = games.find((g) => g.state === "pre" && new Date(g.date) > Date.now());
          const last = games.filter((g) => g.done).pop();

          /* Off-season card: just how the season that ended went. The soccer
             feed carries no record, so it is counted from the games (W-D-L);
             ESPN's team endpoint has it but sends no CORS header.
             ponytail: "no upcoming game listed" = off-season, so a team in
             playoffs ESPN's schedule doesn't list reads as off-season. */
          const done = games.filter((g) => g.done);
          const n = (f) => done.filter(f).length;
          const rec = d.team.recordSummary || (done.length &&
            `${n((g) => g.us.winner)}-${n((g) => !g.us.winner && !g.them.winner)}-${n((g) => g.them.winner)}`);
          if (!next) {
            const rank = d.team.standingSummary && d.team.standingSummary.replace(/ Conference Division$/, " Conference");
            const result = [rec, rank].filter(Boolean).join(", ");
            const year = String(d.season.displayName).split(" ")[0];
            return line("Off-season", result ? `${year}: ${result}` : "");
          }

          let out = "";
          if (rec) out += line("Record", rec); // NHL W-L-OTL, MLS W-D-L (counted)
          if (next) out += line("Next", `${when(next.date, next.timed)} ${vs(next)}`);
          if (last) {
            const r = last.us.winner ? "W" : last.them.winner ? "L" : "T";
            out += line("Last", `${r} ${last.us.score.displayValue}–${last.them.score.displayValue} ${vs(last)}`);
          }
          return out;
        }

        async function f1Lines(team) {
          const api = "https://api.jolpi.ca/ergast/f1/current/";
          const [next, last] = await Promise.all([
            getJSON(api + "next.json").catch(() => null),
            getJSON(api + `last/constructors/${team}/results.json`).catch(() => null),
          ]);
          const gp = (name) => name.replace("Grand Prix", "GP");
          const nr = next && next.MRData.RaceTable.Races[0];
          const lr = last && last.MRData.RaceTable.Races[0];
          const st = await getJSON(api + `constructors/${team}/constructorStandings.json`).catch(() => null);
          const list = st && st.MRData.StandingsTable.StandingsLists[0];
          const c = list && list.ConstructorStandings[0];
          if (!nr) {
            // off-season: last season's constructors' finish
            return line("Off-season", c ? `${list.season}: P${c.position} in constructors, ${c.points} pts` : "");
          }
          let out = "";
          if (c) out += line("Constructors", `P${c.position}, ${c.points} pts`);
          if (nr) out += line("Next", `${gp(nr.raceName)} · ${when(nr.date + "T" + (nr.time || "12:00:00Z"))}`);
          if (lr) {
            const pos = (t) => (/^\d+$/.test(t) ? "P" + t : t === "R" ? "DNF" : t);
            out += line("Last", `${gp(lr.raceName)}: ` +
              lr.Results.map((r) => `${pos(r.positionText)} ${r.Driver.familyName}`).join(", "));
          }
          return out;
        }

        // team colours for the swipe cards (dark end of each team's main colour)
        const TEAM_COLOR = {
          "Green Bay Packers": "#203731", "Queen's Gaels": "#b90e31", "Michigan State Spartans": "#18453b",
          "Toronto Raptors": "#ce1141", "Sacramento Kings": "#5a2d81", "Toronto Tempo": "#6b2c8f",
          "Toronto Maple Leafs": "#00205b", "Team Canada": "#d52b1e", "Toronto FC": "#b81137", "McLaren": "#c85a00",
        };
        $("#sport-tabs").innerHTML = TEAMS.map(
          (g, i) => `<button type="button" role="tab" data-sport="${i}" aria-selected="${i === 0}">${esc(g.sport)}</button>`,
        ).join("");
        $("#teams-grid").innerHTML = TEAMS.map(
          (g, i) => `<div class="sc sport" data-sport="${i}"${i ? " hidden" : ""}>${g.teams
            .map(
              (t) => `<div class="team tcard spring" style="--tc:${TEAM_COLOR[t.name] || "#2a2b30"}"><img class="team-logo" src="${esc(t.logo)}" alt="" loading="lazy" width="88" height="88" /><div><div class="team-name">${esc(t.name)}</div><div class="team-league">${esc(t.league)}</div><div class="team-live"></div></div></div>`,
            )
            .join("")}</div>`,
        ).join("");
        // timeline arrows: one square per click; disabled at either end
        {
          const tl = $("#timeline"), nav = document.querySelector(".sc-nav");
          const step = () => (tl.firstElementChild ? tl.firstElementChild.getBoundingClientRect().width + 14 : 200);
          const sync = () => {
            const [a, b] = nav.querySelectorAll("button");
            a.disabled = tl.scrollLeft <= 2;
            b.disabled = tl.scrollLeft + tl.clientWidth >= tl.scrollWidth - 2;
          };
          nav.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (b) tl.scrollBy({ left: step() * Number(b.dataset.dir), behavior: "smooth" });
          });
          tl.addEventListener("scroll", sync, { passive: true });
          sync();
        }
        $("#sport-tabs").addEventListener("click", (e) => {
          const b = e.target.closest("button");
          if (!b) return;
          document.querySelectorAll("#sport-tabs button").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
          document.querySelectorAll("#teams-grid .sport").forEach((s) => (s.hidden = s.dataset.sport !== b.dataset.sport));
        });

        const liveSlots = $("#teams-grid").querySelectorAll(".team-live");
        TEAMS.flatMap((g) => g.teams).forEach((t, i) => {
          const load = t.espn ? espnLines(t.espn) : t.f1 ? f1Lines(t.f1) : null;
          if (load) load.then((html) => (liveSlots[i].innerHTML = html)).catch(() => {}); // feed down: name + logo stay
        });

        /* ---------- music ----------
           assets/top-artists.json is rewritten daily by
           .github/workflows/top-artists.yml: { ranges: { short_term|medium_term|long_term:
           { artists: [] } } }. No data at all: the section stays hidden. */
        fetch("assets/top-artists.json", { cache: "no-cache" })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            // the pre-Music file held 6-month artists only
            const ranges = (d && d.ranges) || (d && d.artists ? { medium_term: { artists: d.artists } } : {});
            const pick = (range, type) =>
              (ranges[range] && Array.isArray(ranges[range][type]) ? ranges[range][type] : []).filter((x) => x && x.name);
            const all = ["short_term", "medium_term", "long_term"];
            if (!all.some((r) => pick(r, "artists").length)) return;

            const state = { range: "medium_term" };
            // land on something that exists
            if (!pick(state.range, "artists").length) state.range = all.find((r) => pick(r, "artists").length);

            const item = (x) =>
              `<a class="art spring" href="${esc(safeUrl(x.url || "#music"))}" target="_blank" rel="noopener"><img src="${esc(safeUrl(x.image || ""))}" alt="" loading="lazy" /><b>${esc(x.name)}</b></a>`;

            const draw = () => {
              const list = pick(state.range, "artists");
              $("#music-list").innerHTML = list.length
                ? list.map(item).join("")
                : `<p class="music-empty">Not enough listening in this stretch yet.</p>`;
              document.querySelectorAll("#music-range button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.range === state.range)));
            };
            $("#music-range").addEventListener("click", (e) => {
              const b = e.target.closest("button");
              if (b) (state.range = b.dataset.range), draw();
            });
            draw();
            $("#music").hidden = false;
            render(); // number it, rail dot, nav link
          })
          .catch(() => {});

        // sections B: timeline fills and obsessions light up as you scroll
        {
          const tick = () => {
            const vh = innerHeight, tl = $("#timeline"), fill = $("#tlb-fill");
            if (tl && fill) {
              const r = tl.getBoundingClientRect(), mobile = matchMedia("(max-width: 760px)").matches;
              const k = Math.min(1, Math.max(0, (vh * 0.8 - r.top) / (vh * 0.6 + (mobile ? r.height : 0))));
              fill.style[mobile ? "height" : "width"] = k * 100 + "%";
              fill.style[mobile ? "width" : "height"] = "";
              const st = [...tl.querySelectorAll(".tlb-s")];
              st.forEach((s, i) => s.classList.toggle("lit", k >= i / Math.max(1, st.length - 1) - 0.001));
            }
            document.querySelectorAll(".bread").forEach((p) => {
              const r = p.getBoundingClientRect(), w = [...p.querySelectorAll(".w")];
              const k = Math.min(1, Math.max(0, (vh * 0.85 - r.top) / (r.height + vh * 0.25)));
              w.forEach((x, i) => x.classList.toggle("on", i < k * w.length * 1.15));
            });
          };
          addEventListener("scroll", tick, { passive: true });
          addEventListener("resize", tick);
          window.bTick = tick;
          tick();
        }

        // scroll reveal — runs after content is in the DOM
        const reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (!reduce && "IntersectionObserver" in window) {
          const io = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add("in");
                  io.unobserve(e.target);
                }
              });
            },
            { threshold: 0.12 },
          );
          document.querySelectorAll(".reveal").forEach((el) => io.observe(el));
          // thread bubbles pop in one at a time as each scrolls into view
          const bio = new IntersectionObserver(
            (entries) => {
              entries.forEach((e) => {
                if (e.isIntersecting) {
                  e.target.classList.add("in");
                  bio.unobserve(e.target);
                }
              });
            },
            { threshold: 1, rootMargin: "0px 0px -12% 0px" },
          );
          // also called when the published thread replaces the bubbles
          window.watchBubbles = () =>
            document.querySelectorAll(".bub:not(.in)").forEach((el) => bio.observe(el));
          window.watchBubbles();
        } else {
          document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
          window.watchBubbles = () =>
            document.querySelectorAll(".bub").forEach((el) => el.classList.add("in"));
          window.watchBubbles();
        }
      })();
    </script>
  </body>
</html>
